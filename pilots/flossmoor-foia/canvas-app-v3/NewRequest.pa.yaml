            - cntNewRequestActions:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  BorderColor: =ColorNeutralStroke
                  Fill: =ColorSurface
                  FillPortions: =0
                  Height: =ControlMinTouch + SpaceSm * 2
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =SpaceSm
                  LayoutJustifyContent: =If(App.Width < BreakpointPhone, LayoutJustifyContent.SpaceBetween, LayoutJustifyContent.End)
                  LayoutMinHeight: =ControlMinTouch + SpaceSm * 2
                  LayoutMinWidth: =0
                  PaddingBottom: =SpaceSm
                  PaddingLeft: =If(App.Width < BreakpointPhone, Space4, Space5)
                  PaddingRight: =If(App.Width < BreakpointPhone, Space4, Space5)
                  PaddingTop: =SpaceSm
                  RadiusBottomLeft: =RadiusMedium
                  RadiusBottomRight: =RadiusMedium
                  RadiusTopLeft: =RadiusMedium
                  RadiusTopRight: =RadiusMedium
                Children:
                  - btnCancelRequest:
                      Control: ModernButton
                      Properties:
                        AccessibleLabel: ="Cancel new request"
                        AlignInContainer: =AlignInContainer.Center
                        Appearance: =ButtonAppearance.Secondary
                        Font: =FontApp
                        Height: =ControlMinTouch
                        Layout: =ButtonLayout.TextOnly
                        LayoutMinHeight: =ControlMinTouch
                        LayoutMinWidth: =0
                        OnSelect: =Navigate(Home, ScreenTransition.None)
                        RadiusBottomLeft: =RadiusMedium
                        RadiusBottomRight: =RadiusMedium
                        RadiusTopLeft: =RadiusMedium
                        RadiusTopRight: =RadiusMedium
                        Size: =If(App.Width < BreakpointPhone, FontSizeBodyPhone, FontSizeBody)
                        Text: ="Cancel"
                        Width: =If(App.Width < BreakpointPhone, (Parent.Width - Space4 * 2 - SpaceSm) / 2, 120)
                  - btnSaveRequest:
                      Control: ModernButton
                      Properties:
                        AccessibleLabel: ="Save new FOIA request"
                        AlignInContainer: =AlignInContainer.Center
                        BasePaletteColor: =ColorBrand
                        DisplayMode: =If(gblPermissionDenied || gblIsLoading, DisplayMode.Disabled, DisplayMode.Edit)
                        Font: =FontApp
                        Height: =ControlMinTouch
                        Icon: ="Save"
                        LayoutMinHeight: =ControlMinTouch
                        LayoutMinWidth: =0
                        OnSelect: |-
                          =UpdateContext({locShowValidation: true});
                          If(
                            IsBlank(txtRequesterFirstName.Text) || IsBlank(txtRequesterLastName.Text) || IsBlank(txtRequestDescription.Text) || IsBlank(cmbPrimaryDepartment.Selected) || IsBlank(cmbRequestRoute.Selected) || IsBlank(cmbIntakeMethod.Selected) || IsBlank(datReceivedDate.SelectedDate) || IsBlank(datDueDate.SelectedDate) || !gblDueDateConfirmed,
                            cmpToastHostNewRequest.SendToast("Complete the required fields", "Fields marked in red are required and the working due date must be confirmed.", "Warning"),
                            Set(gblIsLoading, true);
                            Set(gblLoadError, false);
                            Set(gblSaveSuccess, false);
                            IfError(
                              Set(
                                gblSelectedRequest,
                                Patch(
                                  'FOIA Pilot Requests',
                                  Defaults('FOIA Pilot Requests'),
                                  {
                                    Title: Concatenate(txtRequesterLastName.Text, ", ", txtRequesterFirstName.Text),
                                    RequesterFirstName: txtRequesterFirstName.Text,
                                    RequesterLastName: txtRequesterLastName.Text,
                                    RequesterEmail: txtRequesterEmail.Text,
                                    RequesterPhone: txtRequesterPhone.Text,
                                    RequestDescription: txtRequestDescription.Text,
                                    PrimaryDepartment: {Id: cmbPrimaryDepartment.Selected.ID, Value: cmbPrimaryDepartment.Selected.Title},
                                    IntakeMethod: cmbIntakeMethod.Selected,
                                    RequestRoute: cmbRequestRoute.Selected,
                                    DeliveryFormat: cmbDeliveryFormat.Selected,
                                    OverallStatus: LookUp(Choices('FOIA Pilot Requests'.OverallStatus), Value = "New"),
                                    ReceivedDate: datReceivedDate.SelectedDate,
                                    DueDate: datDueDate.SelectedDate,
                                    DueDateConfirmed: gblDueDateConfirmed,
                                    CertifiedCopies: LookUp(Choices('FOIA Pilot Requests'.CertifiedCopies), Value = If(chkCertifiedCopies.Checked, "Yes", "No")),
                                    FeeWaiverRequested: LookUp(Choices('FOIA Pilot Requests'.FeeWaiverRequested), Value = If(chkFeeWaiverRequested.Checked, "Yes", "No"))
                                  }
                                )
                              );
                              Set(gblIsLoading, false);
                              Set(gblSaveSuccess, true);
                              cmpToastHostNewRequest.SendToast("Request saved", Coalesce(gblSelectedRequest.Title, "New request") & " is now New and ready for assignment.", "Success");
                              Navigate(RequestDetail, ScreenTransition.Fade),
                              Set(gblIsLoading, false);
                              Set(gblLoadError, true);
                              cmpToastHostNewRequest.SendToast("Couldn't save the request", FirstError.Message, "Error")
                            )
                          )
                        RadiusBottomLeft: =RadiusMedium
                        RadiusBottomRight: =RadiusMedium
                        RadiusTopLeft: =RadiusMedium
                        RadiusTopRight: =RadiusMedium
                        Size: =If(App.Width < BreakpointPhone, FontSizeBodyPhone, FontSizeBody)
                        Text: =If(gblIsLoading, "Saving…", "Save request")
                        Width: =If(App.Width < BreakpointPhone, (Parent.Width - Space4 * 2 - SpaceSm) / 2, 150)
