            AddToast: =
            Height: =Self.AutoHeight
            RemoveToast: =
            SortOrder: =SortOrder.Ascending
            ToastTable: =colToasts
            Width: =If(App.Width < BreakpointPhone, App.Width - 2 * Space4, 300)
