                                                      PaddingBottom: =0
                                                      PaddingLeft: =0
                                                      PaddingRight: =0
                                                      PaddingTop: =0
                                                      Size: =FontSizeCaption
                                                      Text: ="In Progress"
                                                      Wrap: =false
                                          - cntStepConn3:
                                              Control: GroupContainer
                                              Variant: AutoLayout
                                              Properties:
                                                AlignInContainer: =AlignInContainer.Start
                                                DropShadow: =DropShadow.None
                                                FillPortions: =0
                                                Height: =StepperCircleSize
                                                LayoutAlignItems: =LayoutAlignItems.Stretch
                                                LayoutDirection: =LayoutDirection.Vertical
                                                LayoutJustifyContent: =LayoutJustifyContent.Center
                                                LayoutMinHeight: =0
                                                LayoutMinWidth: =0
                                                RadiusBottomLeft: =0
                                                RadiusBottomRight: =0
                                                RadiusTopLeft: =0
                                                RadiusTopRight: =0
                                                Visible: =App.Width >= BreakpointPhone
                                                Width: =StepperConnectorWidth
                                              Children:
                                                - recStepLine3:
                                                    Control: Rectangle
                                                    Properties:
                                                      AlignInContainer: =AlignInContainer.Stretch
                                                      Fill: =If(If(gblSelectedRequest.OverallStatus.Value = "Closed", 4, gblSelectedRequest.OverallStatus.Value = "In Progress", 3, CountRows(Filter('FOIA Pilot Assignments', Request.Id = gblSelectedRequest.ID && Active = true)) > 0, 2, 1) > 3, ColorBrand, ColorBorder)
                                                      Height: =2
                                                      LayoutMinHeight: =0
                                                      LayoutMinWidth: =0
                                          - cntStep4:
                                              Control: GroupContainer
                                              Variant: AutoLayout
                                              Properties:
                                                AlignInContainer: =AlignInContainer.Start
                                                DropShadow: =DropShadow.None
                                                FillPortions: =0
                                                Height: =If(App.Width < BreakpointPhone, StepperCircleSize + Space1, StepperCircleSize + Space1 + 18)
                                                LayoutAlignItems: =LayoutAlignItems.Center
                                                LayoutDirection: =If(App.Width < BreakpointPhone, LayoutDirection.Horizontal, LayoutDirection.Vertical)
                                                LayoutGap: =Space1
                                                LayoutMinHeight: =0
                                                LayoutMinWidth: =0
                                                RadiusBottomLeft: =0
                                                RadiusBottomRight: =0
                                                RadiusTopLeft: =0
                                                RadiusTopRight: =0
                                                Width: =If(App.Width < BreakpointPhone, Parent.Width - Space5 * 2, 96)
                                              Children:
                                                - cntStepCircle4:
                                                    Control: GroupContainer
                                                    Variant: AutoLayout
                                                    Properties:
                                                      AlignInContainer: =AlignInContainer.Center
                                                      BorderColor: =If(If(gblSelectedRequest.OverallStatus.Value = "Closed", 4, gblSelectedRequest.OverallStatus.Value = "In Progress", 3, CountRows(Filter('FOIA Pilot Assignments', Request.Id = gblSelectedRequest.ID && Active = true)) > 0, 2, 1) >= 4, ColorBrand, ColorBorder)
                                                      BorderThickness: =2
                                                      DropShadow: =DropShadow.None
                                                      Fill: =If(If(gblSelectedRequest.OverallStatus.Value = "Closed", 4, gblSelectedRequest.OverallStatus.Value = "In Progress", 3, CountRows(Filter('FOIA Pilot Assignments', Request.Id = gblSelectedRequest.ID && Active = true)) > 0, 2, 1) = 4, ColorBrand, ColorSurface)
                                                      FillPortions: =0
                                                      Height: =StepperCircleSize
                                                      LayoutAlignItems: =LayoutAlignItems.Center
                                                      LayoutDirection: =LayoutDirection.Vertical
                                                      LayoutJustifyContent: =LayoutJustifyContent.Center
                                                      LayoutMinHeight: =0
                                                      LayoutMinWidth: =0
                                                      RadiusBottomLeft: =StepperCircleSize / 2
                                                      RadiusBottomRight: =StepperCircleSize / 2
                                                      RadiusTopLeft: =StepperCircleSize / 2
                                                      RadiusTopRight: =StepperCircleSize / 2
                                                      Width: =StepperCircleSize
                                                    Children:
                                                      - icoStepCheck4:
                                                          Control: ModernIcon
                                                          Properties:
                                                            AccessibleLabel: ="Completed"
                                                            AlignInContainer: =AlignInContainer.Center
                                                            Height: =12
                                                            Icon: ="Checkmark"
                                                            IconColor: =ColorTextOnBrand
                                                            IconStyle: =IconStyle.Filled
                                                            LayoutMinHeight: =12
                                                            LayoutMinWidth: =12
                                                            Visible: =If(gblSelectedRequest.OverallStatus.Value = "Closed", 4, gblSelectedRequest.OverallStatus.Value = "In Progress", 3, CountRows(Filter('FOIA Pilot Assignments', Request.Id = gblSelectedRequest.ID && Active = true)) > 0, 2, 1) >= 4
                                                            Width: =12
                                                - lblStep4:
                                                    Control: ModernText
                                                    Properties:
                                                      AccessibleLabel: |-
                                                        ="Step 4 of 4, Closed: " & If(If(gblSelectedRequest.OverallStatus.Value = "Closed", 4, gblSelectedRequest.OverallStatus.Value = "In Progress", 3, CountRows(Filter('FOIA Pilot Assignments', Request.Id = gblSelectedRequest.ID && Active = true)) > 0, 2, 1) = 4, "completed", "upcoming")
                                                      Align: =If(App.Width < BreakpointPhone, Align.Left, Align.Center)
                                                      AlignInContainer: =If(App.Width < BreakpointPhone, AlignInContainer.Center, AlignInContainer.Stretch)
                                                      AutoHeight: =true
                                                      Color: =If(If(gblSelectedRequest.OverallStatus.Value = "Closed", 4, gblSelectedRequest.OverallStatus.Value = "In Progress", 3, CountRows(Filter('FOIA Pilot Assignments', Request.Id = gblSelectedRequest.ID && Active = true)) > 0, 2, 1) >= 4, ColorTextPrimary, ColorTextTertiary)
                                                      FillPortions: =If(App.Width < BreakpointPhone, 1, 0)
                                                      Font: =FontApp
                                                      FontWeight: =If(If(gblSelectedRequest.OverallStatus.Value = "Closed", 4, gblSelectedRequest.OverallStatus.Value = "In Progress", 3, CountRows(Filter('FOIA Pilot Assignments', Request.Id = gblSelectedRequest.ID && Active = true)) > 0, 2, 1) = 4, FontWeight.Semibold, FontWeight.Normal)
                                                      LayoutMinHeight: =0
                                                      LayoutMinWidth: =0
                                                      PaddingBottom: =0
                                                      PaddingLeft: =0
                                                      PaddingRight: =0
                                                      PaddingTop: =0
                                                      Size: =FontSizeCaption
                                                      Text: ="Closed"
                                                      Wrap: =false
                                    - cmpRequestDetailPane2:
                                        Control: CanvasComponent
                                        ComponentName: cmpRequestDetailPane
                                        Properties:
                                          AlignInContainer: =AlignInContainer.Stretch
                                          FillPortions: =1
                                          Height: =Parent.Height - cntDetailStepperCard.Height - Space4
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                          OnConfirmDueDate: |-
                                            =IfError(
                                              Patch('FOIA Pilot Requests', gblSelectedRequest, {DueDateConfirmed: true});
                                              Set(gblSelectedRequest, LookUp('FOIA Pilot Requests', ID = gblSelectedRequest.ID));
                                              cmpToastHostRequestDetail.SendToast("Due date confirmed", "Statutory deadline locked for " & Coalesce(gblSelectedRequest.Title, "this request") & ".", "Success"),
                                              cmpToastHostRequestDetail.SendToast("Couldn't confirm the due date", FirstError.Message, "Error")
                                            )
                                          OnCreateAssignment: |-
                                            =If(
                                              IsBlank(gblAssignmentDepartmentCandidate),
                                              cmpToastHostRequestDetail.SendToast("Select a department", "Choose a department before creating the assignment.", "Warning"),
                                              IfError(
                                                Set(
                                                  gblSelectedAssignment,
                                                  Patch(
                                                    'FOIA Pilot Assignments',
                                                    Defaults('FOIA Pilot Assignments'),
                                                    {
                                                      Title: Coalesce(gblSelectedRequest.Title, "Request") & " - " & gblAssignmentDepartmentCandidate.Title,
                                                      Request: {Id: gblSelectedRequest.ID, Value: gblSelectedRequest.Title},
                                                      Department: {Id: gblAssignmentDepartmentCandidate.ID, Value: gblAssignmentDepartmentCandidate.Title},
                                                      AssignmentStatus: {Value: "New"},
                                                      AssignmentDueDate: gblSelectedRequest.DueDate,
                                                      Active: true
                                                    }
                                                  )
                                                );
                                                Set(gblSelectedDepartment, gblSelectedAssignment.Department);
                                                Refresh('FOIA Pilot Assignments');
                                                cmpToastHostRequestDetail.SendToast("Department assigned", gblAssignmentDepartmentCandidate.Title & " can now begin department work.", "Success");
                                                Navigate(DepartmentWork, ScreenTransition.None),
                                                cmpToastHostRequestDetail.SendToast("Couldn't create the assignment", FirstError.Message, "Error")
                                              )
                                            )
                                          OnOpenCloseout: =Navigate(ResponseCloseout, ScreenTransition.None)
                                          OnOpenDepartmentWork: |-
                                            =If(IsBlank(gblSelectedAssignment) || gblSelectedAssignment.Request.Id <> gblSelectedRequest.ID,
                                              Set(gblSelectedAssignment, First(Filter('FOIA Pilot Assignments', Request.Id = gblSelectedRequest.ID && Active = true))));
                                            Set(gblSelectedDepartment, gblSelectedAssignment.Department);
                                            Navigate(DepartmentWork, ScreenTransition.None)
                                          ShowQuickActions: =true
                                          Width: =Parent.Width
