                                                DropShadow: =DropShadow.None
                                                FillPortions: =0
                                                Height: =StepperCircleSize
                                                LayoutAlignItems: =LayoutAlignItems.Stretch
                                                LayoutDirection: =LayoutDirection.Vertical
                                                LayoutJustifyContent: =LayoutJustifyContent.Center
                                                LayoutMinHeight: =0
                                                LayoutMinWidth: =0
                                                RadiusBottomLeft: =0
                                                RadiusBottomRight: =0
                                                RadiusTopLeft: =0
                                                RadiusTopRight: =0
                                                Visible: =App.Width >= BreakpointPhone
                                                Width: =StepperConnectorWidth
                                              Children:
                                                - recStepLine2:
                                                    Control: Rectangle
                                                    Properties:
                                                      AlignInContainer: =AlignInContainer.Stretch
                                                      Fill: =If(If(gblSelectedRequest.OverallStatus.Value = "Closed", 4, gblSelectedRequest.OverallStatus.Value = "In Progress", 3, CountRows(Filter('FOIA Pilot Assignments', Request.Id = gblSelectedRequest.ID && Active = true)) > 0, 2, 1) > 2, ColorBrand, ColorBorder)
                                                      Height: =2
                                                      LayoutMinHeight: =0
                                                      LayoutMinWidth: =0
                                          - cntStep3:
                                              Control: GroupContainer
                                              Variant: AutoLayout
                                              Properties:
                                                AlignInContainer: =AlignInContainer.Start
                                                DropShadow: =DropShadow.None
                                                FillPortions: =0
                                                Height: =If(App.Width < BreakpointPhone, StepperCircleSize + Space1, StepperCircleSize + Space1 + 18)
