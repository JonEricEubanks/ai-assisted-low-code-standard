                                                      BorderThickness: =2
                                                      DropShadow: =DropShadow.None
                                                      Fill: =If(If(gblSelectedRequest.OverallStatus.Value = "Closed", 4, gblSelectedRequest.OverallStatus.Value = "In Progress", 3, CountRows(Filter('FOIA Pilot Assignments', Request.Id = gblSelectedRequest.ID && Active = true)) > 0, 2, 1) > 2, ColorBrand, ColorSurface)
                                                      FillPortions: =0
                                                      Height: =StepperCircleSize
                                                      LayoutAlignItems: =LayoutAlignItems.Center
                                                      LayoutDirection: =LayoutDirection.Vertical
                                                      LayoutJustifyContent: =LayoutJustifyContent.Center
                                                      LayoutMinHeight: =0
                                                      LayoutMinWidth: =0
                                                      RadiusBottomLeft: =StepperCircleSize / 2
                                                      RadiusBottomRight: =StepperCircleSize / 2
                                                      RadiusTopLeft: =StepperCircleSize / 2
                                                      RadiusTopRight: =StepperCircleSize / 2
                                                      Width: =StepperCircleSize
                                                    Children:
                                                      - icoStepCheck2:
                                                          Control: ModernIcon
                                                          Properties:
                                                            AccessibleLabel: ="Completed"
                                                            AlignInContainer: =AlignInContainer.Center
                                                            Height: =12
                                                            Icon: ="Checkmark"
                                                            IconColor: =ColorTextOnBrand
                                                            IconStyle: =IconStyle.Filled
                                                            LayoutMinHeight: =12
                                                            LayoutMinWidth: =12
                                                            Visible: =If(gblSelectedRequest.OverallStatus.Value = "Closed", 4, gblSelectedRequest.OverallStatus.Value = "In Progress", 3, CountRows(Filter('FOIA Pilot Assignments', Request.Id = gblSelectedRequest.ID && Active = true)) > 0, 2, 1) > 2
                                                            Width: =12
                                                - lblStep2:
                                                    Control: ModernText
                                                    Properties:
                                                      AccessibleLabel: |-
                                                        ="Step 2 of 4, Assigned: " & If(If(gblSelectedRequest.OverallStatus.Value = "Closed", 4, gblSelectedRequest.OverallStatus.Value = "In Progress", 3, CountRows(Filter('FOIA Pilot Assignments', Request.Id = gblSelectedRequest.ID && Active = true)) > 0, 2, 1) > 2, "completed", If(gblSelectedRequest.OverallStatus.Value = "Closed", 4, gblSelectedRequest.OverallStatus.Value = "In Progress", 3, CountRows(Filter('FOIA Pilot Assignments', Request.Id = gblSelectedRequest.ID && Active = true)) > 0, 2, 1) = 2, "current", "upcoming")
                                                      Align: =If(App.Width < BreakpointPhone, Align.Left, Align.Center)
                                                      AlignInContainer: =If(App.Width < BreakpointPhone, AlignInContainer.Center, AlignInContainer.Stretch)
                                                      AutoHeight: =true
                                                      Color: =If(If(gblSelectedRequest.OverallStatus.Value = "Closed", 4, gblSelectedRequest.OverallStatus.Value = "In Progress", 3, CountRows(Filter('FOIA Pilot Assignments', Request.Id = gblSelectedRequest.ID && Active = true)) > 0, 2, 1) >= 2, ColorTextPrimary, ColorTextTertiary)
                                                      FillPortions: =If(App.Width < BreakpointPhone, 1, 0)
                                                      Font: =FontApp
                                                      FontWeight: =If(If(gblSelectedRequest.OverallStatus.Value = "Closed", 4, gblSelectedRequest.OverallStatus.Value = "In Progress", 3, CountRows(Filter('FOIA Pilot Assignments', Request.Id = gblSelectedRequest.ID && Active = true)) > 0, 2, 1) = 2, FontWeight.Semibold, FontWeight.Normal)
                                                      LayoutMinHeight: =0
                                                      LayoutMinWidth: =0
                                                      PaddingBottom: =0
                                                      PaddingLeft: =0
                                                      PaddingRight: =0
                                                      PaddingTop: =0
                                                      Size: =FontSizeCaption
                                                      Text: ="Assigned"
                                                      Wrap: =false
