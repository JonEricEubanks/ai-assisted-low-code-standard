                                                            LayoutMinHeight: =12
                                                            LayoutMinWidth: =12
                                                            Visible: =If(gblSelectedRequest.OverallStatus.Value = "Closed", 4, gblSelectedRequest.OverallStatus.Value = "In Progress", 3, CountRows(Filter('FOIA Pilot Assignments', Request.Id = gblSelectedRequest.ID && Active = true)) > 0, 2, 1) > 3
                                                            Width: =12
                                                - lblStep3:
                                                    Control: ModernText
                                                    Properties:
                                                      AccessibleLabel: |-
                                                        ="Step 3 of 4, In Progress: " & If(If(gblSelectedRequest.OverallStatus.Value = "Closed", 4, gblSelectedRequest.OverallStatus.Value = "In Progress", 3, CountRows(Filter('FOIA Pilot Assignments', Request.Id = gblSelectedRequest.ID && Active = true)) > 0, 2, 1) > 3, "completed", If(gblSelectedRequest.OverallStatus.Value = "Closed", 4, gblSelectedRequest.OverallStatus.Value = "In Progress", 3, CountRows(Filter('FOIA Pilot Assignments', Request.Id = gblSelectedRequest.ID && Active = true)) > 0, 2, 1) = 3, "current", "upcoming")
