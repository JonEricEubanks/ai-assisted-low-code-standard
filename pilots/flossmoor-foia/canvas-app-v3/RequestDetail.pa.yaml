                                                      Color: =If(If(gblSelectedRequest.OverallStatus.Value = "Closed", 4, gblSelectedRequest.OverallStatus.Value = "In Progress", 3, CountRows(Filter('FOIA Pilot Assignments', Request.Id = gblSelectedRequest.ID && Active = true)) > 0, 2, 1) >= 3, ColorTextPrimary, ColorTextTertiary)
                                                      FillPortions: =If(App.Width < BreakpointPhone, 1, 0)
                                                      Font: =FontApp
                                                      FontWeight: =If(If(gblSelectedRequest.OverallStatus.Value = "Closed", 4, gblSelectedRequest.OverallStatus.Value = "In Progress", 3, CountRows(Filter('FOIA Pilot Assignments', Request.Id = gblSelectedRequest.ID && Active = true)) > 0, 2, 1) = 3, FontWeight.Semibold, FontWeight.Normal)
