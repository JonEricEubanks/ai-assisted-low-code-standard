ComponentDefinitions:
  cmpSideNav:
    DefinitionType: CanvasComponent
    Description: Shared navigation. Placement "Rail" = left rail (desktop/tablet); "Bottom" = phone tab bar.
    AccessAppScope: true
    CustomProperties:
      ActiveScreen:
        PropertyKind: Input
        DisplayName: ActiveScreen
        Description: Name of the current screen used to highlight the active item (Home, NewRequest, DepartmentWork, ResponseCloseout).
        DataType: Text
        Default: ="Home"
      Expanded:
        PropertyKind: Input
        DisplayName: Expanded
        Description: True shows icon + label at RailWidthExpanded; false is the 50px icon rail. Hosts pass gblNavExpanded.
        DataType: Boolean
        Default: =false
      Placement:
        PropertyKind: Input
        DisplayName: Placement
        Description: Rail (vertical left rail) or Bottom (horizontal phone bar).
        DataType: Text
        Default: ="Rail"
    Properties:
      Height: =If(cmpSideNav.Placement = "Bottom", BottomNavHeight, App.Height - HeaderHeight)
      Width: =If(cmpSideNav.Placement = "Bottom", App.Width, If(cmpSideNav.Expanded, RailWidthExpanded, RailWidth))
    Children:
      - cntNavRoot:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            DropShadow: =If(cmpSideNav.Placement = "Rail", DropShadow.Light, DropShadow.None)
            Fill: =ColorSurface
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =If(cmpSideNav.Placement = "Bottom", LayoutDirection.Vertical, LayoutDirection.Horizontal)
            RadiusBottomLeft: =RadiusMedium
            RadiusBottomRight: =RadiusMedium
            RadiusTopLeft: =RadiusMedium
            RadiusTopRight: =RadiusMedium
            Width: =Parent.Width
          Children:
            - cntNavDividerTop:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =ColorNeutralStroke
                  FillPortions: =0
                  Height: =1
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutMinHeight: =1
                  LayoutMinWidth: =0
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  Visible: =false
            - cntNavItems:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  LayoutAlignItems: =If(cmpSideNav.Placement = "Bottom", LayoutAlignItems.Center, LayoutAlignItems.Start)
                  LayoutDirection: =If(cmpSideNav.Placement = "Bottom", LayoutDirection.Horizontal, LayoutDirection.Vertical)
                  LayoutGap: =Space1
                  LayoutJustifyContent: =If(cmpSideNav.Placement = "Bottom", LayoutJustifyContent.SpaceBetween, LayoutJustifyContent.Start)
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  PaddingBottom: =If(cmpSideNav.Placement = "Bottom", SpaceXs, SpaceSm)
                  PaddingLeft: =Space1
                  PaddingRight: =Space1
                  PaddingTop: =Space2
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                Children:
                  - btnNavHome:
                      Control: ModernButton
                      Properties:
                        AccessibleLabel: ="Go to Home"
                        Align: =If(cmpSideNav.Placement = "Rail" && App.Width >= BreakpointDesktop, Align.Left, Align.Center)
                        AlignInContainer: =If(cmpSideNav.Placement = "Bottom", AlignInContainer.Center, AlignInContainer.Stretch)
                        Appearance: =If(cmpSideNav.ActiveScreen = "Home", ButtonAppearance.Secondary, ButtonAppearance.Subtle)
                        Color: =If(cmpSideNav.ActiveScreen = "Home", ColorBrand, ColorTextPrimary)
                        FontWeight: =If(cmpSideNav.ActiveScreen = "Home", FontWeight.Semibold, FontWeight.Normal)
                        Height: =ControlMinTouch
                        Icon: ="Home"
                        IconStyle: =If(cmpSideNav.ActiveScreen = "Home", IconStyle.Filled, IconStyle.Outline)
                        Layout: =If(cmpSideNav.Placement = "Rail" && App.Width >= BreakpointDesktop, ButtonLayout.IconBefore, ButtonLayout.IconOnly)
                        LayoutMinHeight: =ControlMinTouch
                        LayoutMinWidth: =ControlMinTouch
                        OnSelect: =Navigate(Home, ScreenTransition.None)
                        Size: =FontSizeBody
                        Text: ="Home"
                        Tooltip: ="Home"
                        Visible: =false
                        Width: |-
                          =If(cmpSideNav.Placement = "Bottom",
                              (Parent.Width - SpaceSm * 2 - SpaceXs * 3) / 4,
                              Parent.Width - SpaceSm * 2)
                  - btnNavNewRequest:
                      Control: ModernButton
                      Properties:
                        AccessibleLabel: ="Go to New request"
                        Align: =If(cmpSideNav.Placement = "Rail" && App.Width >= BreakpointDesktop, Align.Left, Align.Center)
                        AlignInContainer: =If(cmpSideNav.Placement = "Bottom", AlignInContainer.Center, AlignInContainer.Stretch)
                        Appearance: =If(cmpSideNav.ActiveScreen = "NewRequest", ButtonAppearance.Secondary, ButtonAppearance.Subtle)
                        Color: =If(cmpSideNav.ActiveScreen = "NewRequest", ColorBrand, ColorTextPrimary)
                        FontWeight: =If(cmpSideNav.ActiveScreen = "NewRequest", FontWeight.Semibold, FontWeight.Normal)
                        Height: =ControlMinTouch
                        Icon: ="Add"
                        IconStyle: =If(cmpSideNav.ActiveScreen = "NewRequest", IconStyle.Filled, IconStyle.Outline)
                        Layout: =If(cmpSideNav.Placement = "Rail" && App.Width >= BreakpointDesktop, ButtonLayout.IconBefore, ButtonLayout.IconOnly)
                        LayoutMinHeight: =ControlMinTouch
                        LayoutMinWidth: =ControlMinTouch
                        OnSelect: =Navigate(NewRequest, ScreenTransition.None)
                        Size: =FontSizeBody
                        Text: ="New request"
                        Tooltip: ="New request"
                        Visible: =false
                        Width: |-
                          =If(cmpSideNav.Placement = "Bottom",
                              (Parent.Width - SpaceSm * 2 - SpaceXs * 3) / 4,
                              Parent.Width - SpaceSm * 2)
                  - btnNavDepartmentWork:
                      Control: ModernButton
                      Properties:
                        AccessibleLabel: ="Go to Department work"
                        Align: =If(cmpSideNav.Placement = "Rail" && App.Width >= BreakpointDesktop, Align.Left, Align.Center)
                        AlignInContainer: =If(cmpSideNav.Placement = "Bottom", AlignInContainer.Center, AlignInContainer.Stretch)
                        Appearance: =If(cmpSideNav.ActiveScreen = "DepartmentWork", ButtonAppearance.Secondary, ButtonAppearance.Subtle)
                        Color: =If(cmpSideNav.ActiveScreen = "DepartmentWork", ColorBrand, ColorTextPrimary)
                        FontWeight: =If(cmpSideNav.ActiveScreen = "DepartmentWork", FontWeight.Semibold, FontWeight.Normal)
                        Height: =ControlMinTouch
                        Icon: ="People"
                        IconStyle: =If(cmpSideNav.ActiveScreen = "DepartmentWork", IconStyle.Filled, IconStyle.Outline)
                        Layout: =If(cmpSideNav.Placement = "Rail" && App.Width >= BreakpointDesktop, ButtonLayout.IconBefore, ButtonLayout.IconOnly)
                        LayoutMinHeight: =ControlMinTouch
                        LayoutMinWidth: =ControlMinTouch
                        OnSelect: =Navigate(DepartmentWork, ScreenTransition.None)
                        Size: =FontSizeBody
                        Text: ="Department work"
                        Tooltip: ="Department work"
                        Visible: =false
                        Width: |-
                          =If(cmpSideNav.Placement = "Bottom",
                              (Parent.Width - SpaceSm * 2 - SpaceXs * 3) / 4,
                              Parent.Width - SpaceSm * 2)
                  - btnNavResponseCloseout:
                      Control: ModernButton
                      Properties:
                        AccessibleLabel: ="Go to Closeout"
                        Align: =If(cmpSideNav.Placement = "Rail" && App.Width >= BreakpointDesktop, Align.Left, Align.Center)
                        AlignInContainer: =If(cmpSideNav.Placement = "Bottom", AlignInContainer.Center, AlignInContainer.Stretch)
                        Appearance: =If(cmpSideNav.ActiveScreen = "ResponseCloseout", ButtonAppearance.Secondary, ButtonAppearance.Subtle)
                        Color: =If(cmpSideNav.ActiveScreen = "ResponseCloseout", ColorBrand, ColorTextPrimary)
                        FontWeight: =If(cmpSideNav.ActiveScreen = "ResponseCloseout", FontWeight.Semibold, FontWeight.Normal)
                        Height: =ControlMinTouch
                        Icon: ="CheckmarkCircle"
                        IconStyle: =If(cmpSideNav.ActiveScreen = "ResponseCloseout", IconStyle.Filled, IconStyle.Outline)
                        Layout: =If(cmpSideNav.Placement = "Rail" && App.Width >= BreakpointDesktop, ButtonLayout.IconBefore, ButtonLayout.IconOnly)
                        LayoutMinHeight: =ControlMinTouch
                        LayoutMinWidth: =ControlMinTouch
                        OnSelect: =Navigate(ResponseCloseout, ScreenTransition.None)
                        Size: =FontSizeBody
                        Text: ="Closeout"
                        Tooltip: ="Closeout"
                        Visible: =false
                        Width: |-
                          =If(cmpSideNav.Placement = "Bottom",
                              (Parent.Width - SpaceSm * 2 - SpaceXs * 3) / 4,
                              Parent.Width - SpaceSm * 2)
                  - btnNavExpand:
                      Control: ModernButton
                      Properties:
                        AccessibleLabel: =If(cmpSideNav.Expanded, "Collapse navigation", "Expand navigation")
                        AlignInContainer: =AlignInContainer.Start
                        Appearance: =ButtonAppearance.Subtle
                        Color: =ColorTextSecondary
                        Height: =RailWidth - Space2
                        Icon: ="GridDots"
                        Layout: =ButtonLayout.IconOnly
                        LayoutMinHeight: =RailWidth - Space2
                        LayoutMinWidth: =RailWidth - Space2
                        OnSelect: =Set(gblNavExpanded, !gblNavExpanded)
                        Size: =FontSizeBody
                        Text: ="Menu"
                        Tooltip: =If(cmpSideNav.Expanded, "Collapse", "Expand")
                        Visible: =cmpSideNav.Placement = "Rail"
                        Width: =RailWidth - Space2
                  - cntNavItemHome:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        AlignInContainer: =AlignInContainer.Start
                        DropShadow: =DropShadow.None
                        Fill: =If(cmpSideNav.ActiveScreen = "Home", ColorBrandTint, RGBA(0, 0, 0, 0))
                        FillPortions: =0
                        Height: =RailWidth - Space2
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        RadiusBottomLeft: =RadiusMedium
                        RadiusBottomRight: =RadiusMedium
                        RadiusTopLeft: =RadiusMedium
                        RadiusTopRight: =RadiusMedium
                        Visible: =cmpSideNav.Placement = "Rail"
                        Width: =If(cmpSideNav.Expanded, Parent.Width - Space1 * 2, RailWidth - Space2)
                      Children:
                        - btnNavHome2:
                            Control: ModernButton
                            Properties:
                              AccessibleLabel: ="Go to Home"
                              Align: =Align.Left
                              AlignInContainer: =AlignInContainer.Stretch
                              Appearance: =ButtonAppearance.Subtle
                              Color: =If(cmpSideNav.ActiveScreen = "Home", ColorBrand, ColorTextSecondary)
                              FillPortions: =1
                              Font: =FontApp
                              FontWeight: =If(cmpSideNav.ActiveScreen = "Home", FontWeight.Semibold, FontWeight.Normal)
                              Height: =RailWidth - Space2
                              Icon: ="Home"
                              IconStyle: =If(cmpSideNav.ActiveScreen = "Home", IconStyle.Filled, IconStyle.Outline)
                              Layout: =If(cmpSideNav.Expanded, ButtonLayout.IconBefore, ButtonLayout.IconOnly)
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              OnSelect: =Navigate(Home, ScreenTransition.None)
                              Size: =FontSizeBody
                              Text: ="Home"
                              Tooltip: ="Home"
                  - cntNavItemNewRequest:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        AlignInContainer: =AlignInContainer.Start
                        DropShadow: =DropShadow.None
                        Fill: =If(cmpSideNav.ActiveScreen = "NewRequest", ColorBrandTint, RGBA(0, 0, 0, 0))
                        FillPortions: =0
                        Height: =RailWidth - Space2
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        RadiusBottomLeft: =RadiusMedium
                        RadiusBottomRight: =RadiusMedium
                        RadiusTopLeft: =RadiusMedium
                        RadiusTopRight: =RadiusMedium
                        Visible: =cmpSideNav.Placement = "Rail"
                        Width: =If(cmpSideNav.Expanded, Parent.Width - Space1 * 2, RailWidth - Space2)
                      Children:
                        - btnNavNewRequest2:
                            Control: ModernButton
                            Properties:
                              AccessibleLabel: ="Go to New request"
                              Align: =Align.Left
                              AlignInContainer: =AlignInContainer.Stretch
                              Appearance: =ButtonAppearance.Subtle
                              Color: =If(cmpSideNav.ActiveScreen = "NewRequest", ColorBrand, ColorTextSecondary)
                              FillPortions: =1
                              Font: =FontApp
                              FontWeight: =If(cmpSideNav.ActiveScreen = "NewRequest", FontWeight.Semibold, FontWeight.Normal)
                              Height: =RailWidth - Space2
                              Icon: ="Add"
                              IconStyle: =If(cmpSideNav.ActiveScreen = "NewRequest", IconStyle.Filled, IconStyle.Outline)
                              Layout: =If(cmpSideNav.Expanded, ButtonLayout.IconBefore, ButtonLayout.IconOnly)
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              OnSelect: =Navigate(NewRequest, ScreenTransition.None)
                              Size: =FontSizeBody
                              Text: ="New request"
                              Tooltip: ="New request"
                  - cntNavItemDepartmentWork:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        AlignInContainer: =AlignInContainer.Start
                        DropShadow: =DropShadow.None
                        Fill: =If(cmpSideNav.ActiveScreen = "DepartmentWork", ColorBrandTint, RGBA(0, 0, 0, 0))
                        FillPortions: =0
                        Height: =RailWidth - Space2
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        RadiusBottomLeft: =RadiusMedium
                        RadiusBottomRight: =RadiusMedium
                        RadiusTopLeft: =RadiusMedium
                        RadiusTopRight: =RadiusMedium
                        Visible: =cmpSideNav.Placement = "Rail"
                        Width: =If(cmpSideNav.Expanded, Parent.Width - Space1 * 2, RailWidth - Space2)
                      Children:
                        - btnNavDepartmentWork2:
                            Control: ModernButton
                            Properties:
                              AccessibleLabel: ="Go to Department work"
                              Align: =Align.Left
                              AlignInContainer: =AlignInContainer.Stretch
                              Appearance: =ButtonAppearance.Subtle
                              Color: =If(cmpSideNav.ActiveScreen = "DepartmentWork", ColorBrand, ColorTextSecondary)
                              FillPortions: =1
                              Font: =FontApp
                              FontWeight: =If(cmpSideNav.ActiveScreen = "DepartmentWork", FontWeight.Semibold, FontWeight.Normal)
                              Height: =RailWidth - Space2
                              Icon: ="People"
                              IconStyle: =If(cmpSideNav.ActiveScreen = "DepartmentWork", IconStyle.Filled, IconStyle.Outline)
                              Layout: =If(cmpSideNav.Expanded, ButtonLayout.IconBefore, ButtonLayout.IconOnly)
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              OnSelect: =Navigate(DepartmentWork, ScreenTransition.None)
                              Size: =FontSizeBody
                              Text: ="Department work"
                              Tooltip: ="Department work"
                  - cntNavItemResponseCloseout:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        AlignInContainer: =AlignInContainer.Start
                        DropShadow: =DropShadow.None
                        Fill: =If(cmpSideNav.ActiveScreen = "ResponseCloseout", ColorBrandTint, RGBA(0, 0, 0, 0))
                        FillPortions: =0
                        Height: =RailWidth - Space2
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        RadiusBottomLeft: =RadiusMedium
                        RadiusBottomRight: =RadiusMedium
                        RadiusTopLeft: =RadiusMedium
                        RadiusTopRight: =RadiusMedium
                        Visible: =cmpSideNav.Placement = "Rail"
                        Width: =If(cmpSideNav.Expanded, Parent.Width - Space1 * 2, RailWidth - Space2)
                      Children:
                        - btnNavResponseCloseout2:
                            Control: ModernButton
                            Properties:
                              AccessibleLabel: ="Go to Closeout"
                              Align: =Align.Left
                              AlignInContainer: =AlignInContainer.Stretch
                              Appearance: =ButtonAppearance.Subtle
                              Color: =If(cmpSideNav.ActiveScreen = "ResponseCloseout", ColorBrand, ColorTextSecondary)
                              FillPortions: =1
                              Font: =FontApp
                              FontWeight: =If(cmpSideNav.ActiveScreen = "ResponseCloseout", FontWeight.Semibold, FontWeight.Normal)
                              Height: =RailWidth - Space2
                              Icon: ="CheckmarkCircle"
                              IconStyle: =If(cmpSideNav.ActiveScreen = "ResponseCloseout", IconStyle.Filled, IconStyle.Outline)
                              Layout: =If(cmpSideNav.Expanded, ButtonLayout.IconBefore, ButtonLayout.IconOnly)
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              OnSelect: =Navigate(ResponseCloseout, ScreenTransition.None)
                              Size: =FontSizeBody
                              Text: ="Closeout"
                              Tooltip: ="Closeout"
            - cntNavDividerSide:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =ColorNeutralStroke
                  FillPortions: =0
                  Height: =Parent.Height
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutMinHeight: =0
                  LayoutMinWidth: =1
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  Visible: =false
                  Width: =1
