ComponentDefinitions:
  cmpRequestDetailPane:
    DefinitionType: CanvasComponent
    Description: Single request detail surface (summary / assignments / activity). Reads gblSelectedRequest through app scope; performs no writes - quick actions raise events for the host screen.
    AccessAppScope: true
    CustomProperties:
      OnConfirmDueDate:
        PropertyKind: Event
        DisplayName: OnConfirmDueDate
        Description: Raised when "Confirm due date" is selected. Host patches DueDateConfirmed inside IfError.
        ReturnType: None
        Default: =false
      OnCreateAssignment:
        PropertyKind: Event
        DisplayName: OnCreateAssignment
        Description: Raised after a department is selected. The host creates the assignment using gblAssignmentDepartmentCandidate.
        ReturnType: None
        Default: =false
      OnOpenCloseout:
        PropertyKind: Event
        DisplayName: OnOpenCloseout
        Description: Raised when "Closeout" is selected. Host navigates to ResponseCloseout.
        ReturnType: None
        Default: =false
      OnOpenDepartmentWork:
        PropertyKind: Event
        DisplayName: OnOpenDepartmentWork
        Description: Raised when "Open department work" or an assignment row's open button is selected. gblSelectedAssignment / gblSelectedDepartment are already set by the pane when raised from a row.
        ReturnType: None
        Default: =false
      ShowQuickActions:
        PropertyKind: Input
        DisplayName: ShowQuickActions
        Description: Shows the quick-action strip (confirm due date, open department work, closeout).
        DataType: Boolean
        Default: =true
    Properties:
      Fill: =ColorCanvas
      Height: =600
      Width: =480
    Children:
      - cntPaneRoot:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            BorderColor: =ColorNeutralStroke
            BorderThickness: =1
            DropShadow: =DropShadow.None
            Fill: =ColorCanvas
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Vertical
            LayoutGap: =SpaceSm
            LayoutOverflowY: =LayoutOverflow.Scroll
            PaddingBottom: =If(cmpRequestDetailPane.Width < 760, PagePaddingPhone, PagePaddingWide)
            PaddingLeft: =If(cmpRequestDetailPane.Width < 760, PagePaddingPhone, PagePaddingWide)
            PaddingRight: =If(cmpRequestDetailPane.Width < 760, PagePaddingPhone, PagePaddingWide)
            PaddingTop: =If(cmpRequestDetailPane.Width < 760, PagePaddingPhone, PagePaddingWide)
            RadiusBottomLeft: =RadiusLarge
            RadiusBottomRight: =RadiusLarge
            RadiusTopLeft: =RadiusLarge
            RadiusTopRight: =RadiusLarge
            Width: =Parent.Width
          Children:
            - cntPaneHead:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  BorderColor: =ColorNeutralStroke
                  BorderThickness: =1
                  DropShadow: =DropShadow.Regular
                  Fill: =ColorSurface
                  FillPortions: =0
                  Height: =64
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =SpaceSm
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  PaddingBottom: =SpaceSm
                  PaddingLeft: =SpaceMd
                  PaddingRight: =SpaceMd
                  PaddingTop: =SpaceSm
                  RadiusBottomLeft: =RadiusLarge
                  RadiusBottomRight: =RadiusLarge
                  RadiusTopLeft: =RadiusLarge
                  RadiusTopRight: =RadiusLarge
                Children:
                  - cntPaneRecordIcon:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =ColorBrandTint
                        FillPortions: =0
                        Height: =36
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutJustifyContent: =LayoutJustifyContent.Center
                        LayoutMinHeight: =36
                        LayoutMinWidth: =36
                        RadiusBottomLeft: =RadiusMedium
                        RadiusBottomRight: =RadiusMedium
                        RadiusTopLeft: =RadiusMedium
                        RadiusTopRight: =RadiusMedium
                        Visible: =cmpRequestDetailPane.Width >= 520
                        Width: =36
                      Children:
                        - icoPaneRecord:
                            Control: ModernIcon
                            Properties:
                              AccessibleLabel: ="FOIA request"
                              Height: =22
                              Icon: ="DocumentBulletList"
                              IconColor: =ColorBrand
                              IconStyle: =IconStyle.Filled
                              LayoutMinHeight: =22
                              LayoutMinWidth: =22
                              Width: =22
                  - cntPaneTitles:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        AlignInContainer: =AlignInContainer.SetByContainer
                        DropShadow: =DropShadow.None
                        Height: =47
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =SpaceXs
                        LayoutJustifyContent: =LayoutJustifyContent.Center
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                      Children:
                        - lblPaneTitle:
                            Control: ModernText
                            Properties:
                              AccessibleLabel: =Self.Text
                              AlignInContainer: =AlignInContainer.Stretch
                              AutoHeight: =true
                              Color: =ColorTextPrimary
                              FontWeight: =FontWeight.Semibold
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                              Size: =If(cmpRequestDetailPane.Width < 520, FontSizeTitlePhone, cmpRequestDetailPane.Width < 760, FontSizeTitleTablet, FontSizeTitleDesktop)
                              Text: =Coalesce(gblSelectedRequest.Title, "No request selected")
                        - lblPaneMeta:
                            Control: ModernText
                            Properties:
                              AccessibleLabel: =Self.Text
                              AlignInContainer: =AlignInContainer.Stretch
                              AutoHeight: =true
                              Color: =ColorTextSecondary
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                              Size: =FontSizeCaption
                              Text: |-
                                =gblSelectedRequest.RequesterFirstName & " " & gblSelectedRequest.RequesterLastName &
                                " · Received " & If(IsBlank(gblSelectedRequest.ReceivedDate), "—", Text(gblSelectedRequest.ReceivedDate, "mmm d, yyyy")) &
                                If(cmpRequestDetailPane.Width >= 640, " · " & Coalesce(gblSelectedRequest.PrimaryDepartment.Value, "No department"), "")
                  - bdgPaneStatus:
                      Control: ModernBadge
                      Properties:
                        AccessibleLabel: |-
                          ="Status: " & Coalesce(gblSelectedRequest.OverallStatus.Value, "Not set")
                        Content: =Coalesce(gblSelectedRequest.OverallStatus.Value, "Not set")
                        FontWeight: =FontWeight.Semibold
                        Height: =24
                        Icon: |-
                          =Switch(gblSelectedRequest.OverallStatus.Value,
                            "New", "Info",
                            "In Progress", "ArrowClockwise",
                            "On Hold", "Pause",
                            "Ready", "Checkmark",
                            "Delivered", "Send",
                            "Closed", "CheckmarkCircle",
                            "Complete", "CheckmarkCircle",
                            "Overdue", "Warning",
                            "Circle")
                        Intent: |-
                          =Switch(gblSelectedRequest.OverallStatus.Value,
                            "New", BadgeIntent.Informative,
                            "In Progress", BadgeIntent.Highlight,
                            "On Hold", BadgeIntent.Caution,
                            "Ready", BadgeIntent.Attention,
                            "Delivered", BadgeIntent.Positive,
                            "Closed", BadgeIntent.Positive,
                            "Complete", BadgeIntent.Positive,
                            "Overdue", BadgeIntent.Critical,
                            BadgeIntent.Neutral)
                        LayoutMinHeight: =24
                        LayoutMinWidth: =72
                        Shape: =BadgeShape.Rounded
                        Size: =FontSizeCaption
                        Width: =72
                  - cntPaneHeaderActions:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        FillPortions: =0
                        Height: =ControlMinTouch
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =SpaceSm
                        LayoutJustifyContent: =LayoutJustifyContent.End
                        LayoutMinHeight: =ControlMinTouch
                        LayoutMinWidth: =0
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                        Visible: =cmpRequestDetailPane.ShowQuickActions && cmpRequestDetailPane.Width >= 820
                        Width: =If(btnPaneHeaderConfirmDue.Visible, btnPaneHeaderConfirmDue.Width + SpaceSm, 0) + btnPaneHeaderDeptWork.Width + btnPaneHeaderCloseout.Width + SpaceSm
                      Children:
                        - btnPaneHeaderConfirmDue:
                            Control: ModernButton
                            Properties:
                              AccessibleLabel: ="Confirm the working due date"
                              Appearance: =ButtonAppearance.Subtle
                              Height: =ControlMinTouch
                              Icon: ="Checkmark"
                              Layout: =ButtonLayout.IconOnly
                              LayoutMinHeight: =ControlMinTouch
                              LayoutMinWidth: =ControlMinTouch
                              OnSelect: =cmpRequestDetailPane.OnConfirmDueDate()
                              Text: ="Confirm due date"
                              Tooltip: =Self.Text
                              Visible: =btnPaneConfirmDue.Visible
                              Width: =ControlMinTouch
                        - btnPaneHeaderDeptWork:
                            Control: ModernButton
                            Properties:
                              AccessibleLabel: =btnPaneDeptWork.AccessibleLabel
                              Appearance: =ButtonAppearance.Secondary
                              DisplayMode: =btnPaneDeptWork.DisplayMode
                              Height: =ControlMinTouch
                              Icon: =If(btnPaneDeptWork.Text = "Assign department", "Add", "People")
                              LayoutMinHeight: =ControlMinTouch
                              LayoutMinWidth: =150
                              OnSelect: =Select(btnPaneDeptWork)
                              Size: =FontSizeCaption
                              Text: =If(btnPaneDeptWork.Text = "Assign department", "Assign", "Department work")
                              Tooltip: =btnPaneDeptWork.Tooltip
                              Width: =150
                        - btnPaneHeaderCloseout:
                            Control: ModernButton
                            Properties:
                              AccessibleLabel: ="Open response closeout for this request"
                              BasePaletteColor: =ColorBrand
                              Height: =ControlMinTouch
                              Icon: ="CheckmarkCircle"
                              LayoutMinHeight: =ControlMinTouch
                              LayoutMinWidth: =108
                              OnSelect: =cmpRequestDetailPane.OnOpenCloseout()
                              Size: =FontSizeCaption
                              Text: ="Closeout"
                              Tooltip: =Self.Text
                              Width: =108
            - cntPaneQuickActions:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  FillPortions: =0
                  Height: =ControlMinTouch
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =SpaceSm
                  LayoutJustifyContent: =LayoutJustifyContent.End
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  Visible: =cmpRequestDetailPane.ShowQuickActions && cmpRequestDetailPane.Width < 820
                Children:
                  - btnPaneConfirmDue:
                      Control: ModernButton
                      Properties:
                        AccessibleLabel: ="Confirm the working due date"
                        AlignInContainer: =AlignInContainer.Center
                        Appearance: =ButtonAppearance.Secondary
                        Icon: ="Checkmark"
                        Layout: =If(cmpRequestDetailPane.Width < 460, ButtonLayout.IconOnly, ButtonLayout.IconBefore)
                        LayoutMinWidth: =If(cmpRequestDetailPane.Width < 460, ControlMinTouch, 132)
                        OnSelect: =cmpRequestDetailPane.OnConfirmDueDate()
                        Size: =FontSizeBody
                        Text: ="Confirm due date"
                        Tooltip: =Self.Text
                        Visible: =!IsBlank(gblSelectedRequest.DueDate) && !gblSelectedRequest.DueDateConfirmed
                        Width: =If(cmpRequestDetailPane.Width < 460, ControlMinTouch, 132)
                  - btnPaneDeptWork:
                      Control: ModernButton
                      Properties:
                        AccessibleLabel: ="Assign a department or open department work for this request"
                        AlignInContainer: =AlignInContainer.Center
                        Appearance: =ButtonAppearance.Secondary
                        DisplayMode: =If(IsBlank(gblSelectedRequest), DisplayMode.Disabled, DisplayMode.Edit)
                        Height: =36
                        Icon: =If(CountRows(Filter('FOIA Pilot Assignments', Request.Id = gblSelectedRequest.ID && Active = true)) = 0, "Add", "People")
                        Layout: =If(cmpRequestDetailPane.Width < 460, ButtonLayout.IconOnly, ButtonLayout.IconBefore)
                        LayoutMinHeight: =36
                        LayoutMinWidth: =If(cmpRequestDetailPane.Width < 460, ControlMinTouch, If(cmpRequestDetailPane.Width < 640, 120, 168))
                        OnSelect: |-
                          =If(
                            CountRows(Filter('FOIA Pilot Assignments', Request.Id = gblSelectedRequest.ID && Active = true)) = 0,
                            Set(gblShowAssignmentModal, true),
                            cmpRequestDetailPane.OnOpenDepartmentWork()
                          )
                        Size: =FontSizeBody
                        Text: |-
                          =If(
                            CountRows(Filter('FOIA Pilot Assignments', Request.Id = gblSelectedRequest.ID && Active = true)) = 0,
                            If(cmpRequestDetailPane.Width < 640, "Assign", "Assign department"),
                            If(cmpRequestDetailPane.Width < 640, "Open work", "Department work")
                          )
                        Tooltip: =Self.Text
                        Width: =If(cmpRequestDetailPane.Width < 460, ControlMinTouch, If(cmpRequestDetailPane.Width < 640, 120, 168))
                  - btnPaneCloseout:
                      Control: ModernButton
                      Properties:
                        AccessibleLabel: ="Open response closeout for this request"
                        AlignInContainer: =AlignInContainer.Center
                        BasePaletteColor: =ColorBrand
                        Height: =36
                        Icon: ="CheckmarkCircle"
                        Layout: =If(cmpRequestDetailPane.Width < 460, ButtonLayout.IconOnly, ButtonLayout.IconBefore)
                        LayoutMinHeight: =36
                        LayoutMinWidth: =If(cmpRequestDetailPane.Width < 460, ControlMinTouch, 112)
                        OnSelect: =cmpRequestDetailPane.OnOpenCloseout()
                        Size: =FontSizeBody
                        Text: ="Closeout"
                        Tooltip: =Self.Text
                        Width: =If(cmpRequestDetailPane.Width < 460, ControlMinTouch, 112)
            - cntPaneSignalBar:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  BorderColor: =ColorNeutralStroke
                  BorderThickness: =1
                  Fill: =ColorSurface
                  FillPortions: =0
                  Height: =40
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =SpaceSm
                  LayoutMinHeight: =40
                  LayoutMinWidth: =0
                  PaddingBottom: =SpaceXs
                  PaddingLeft: =SpaceSm
                  PaddingRight: =SpaceSm
                  PaddingTop: =SpaceXs
                  RadiusBottomLeft: =RadiusMedium
                  RadiusBottomRight: =RadiusMedium
                  RadiusTopLeft: =RadiusMedium
                  RadiusTopRight: =RadiusMedium
                Children:
                  - tabPaneCommand:
                      Control: ModernTabList
                      Properties:
                        AccessibleLabel: ="Request detail sections"
                        Appearance: =TabListAppearance.Subtle
                        Default: |-
                          ={Value: "Summary"}
                        FillPortions: =1
                        Height: =30
                        Items: =["Summary", "Assignments", "Activity"]
                        LayoutMinHeight: =30
                        LayoutMinWidth: =220
                        Size: =FontSizeBody
                        TabSize: =TabSize.Small
                  - bdgPaneDueSignal:
                      Control: ModernBadge
                      Properties:
                        AccessibleLabel: ="Deadline status for the selected request"
                        Content: |-
                          =If(
                            IsBlank(gblSelectedRequest.DueDate),
                            "Due date not set",
                            gblSelectedRequest.DueDate < Today(),
                            "Overdue · " & Text(gblSelectedRequest.DueDate, "mmm d"),
                            DateDiff(Today(), gblSelectedRequest.DueDate) <= 7,
                            "Due " & Text(gblSelectedRequest.DueDate, "mmm d") & " · " & DateDiff(Today(), gblSelectedRequest.DueDate) & "d",
                            "Due " & Text(gblSelectedRequest.DueDate, "mmm d")
                          )
                        FontWeight: =FontWeight.Semibold
                        Height: =24
                        Icon: ="Calendar"
                        Intent: |-
                          =If(
                            IsBlank(gblSelectedRequest.DueDate),
                            BadgeIntent.Neutral,
                            gblSelectedRequest.DueDate < Today(),
                            BadgeIntent.Critical,
                            DateDiff(Today(), gblSelectedRequest.DueDate) <= 7,
                            BadgeIntent.Caution,
                            gblSelectedRequest.DueDateConfirmed,
                            BadgeIntent.Positive,
                            BadgeIntent.Informative
                          )
                        LayoutMinHeight: =22
                        LayoutMinWidth: =120
                        Shape: =BadgeShape.Rounded
                        Size: =FontSizeCaption
                        Visible: =cmpRequestDetailPane.Width >= 900
                        Width: =120
                  - bdgPaneAssignmentSignal:
                      Control: ModernBadge
                      Properties:
                        AccessibleLabel: ="Department assignment status for the selected request"
                        Content: =If(btnPaneDeptWork.Text = "Assign department", "Needs assignment", "Department assigned")
                        FontWeight: =FontWeight.Semibold
                        Height: =24
                        Icon: ="People"
                        Intent: =If(btnPaneDeptWork.Text = "Assign department", BadgeIntent.Attention, BadgeIntent.Positive)
                        LayoutMinHeight: =24
                        LayoutMinWidth: =148
                        Shape: =BadgeShape.Rounded
                        Size: =FontSizeCaption
                        Visible: =cmpRequestDetailPane.Width >= 900
                        Width: =148
            - cntPaneTabSummary:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  FillPortions: =0
                  Height: =cntPaneFields.Height + cntPaneDescriptionBlock.Height + cntPaneStageNotesBlock.Height + cntPaneExtension.Height + SpaceMd * 3
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =SpaceMd
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  Visible: =tabPaneCommand.Selected.Value = "Summary"
                Children:
                  - cntPaneFields:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        BorderColor: =ColorNeutralStroke
                        BorderThickness: =1
                        DropShadow: =DropShadow.Regular
                        Fill: =ColorSurface
                        FillPortions: =0
                        Height: =If(cmpRequestDetailPane.Width < 520, 11 * FieldHeight + 3 * 36 + 13 * SpaceMd + SpaceMd * 2, cmpRequestDetailPane.Width < 1500, 5 * FieldHeight + 3 * 36 + 7 * SpaceMd + SpaceMd * 2, 4 * FieldHeight + 3 * 36 + 6 * SpaceMd + SpaceMd * 2)
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =SpaceMd
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        LayoutWrap: =true
                        PaddingBottom: =SpaceMd
                        PaddingLeft: =SpaceMd
                        PaddingRight: =SpaceMd
                        PaddingTop: =SpaceMd
                        RadiusBottomLeft: =RadiusLarge
                        RadiusBottomRight: =RadiusLarge
                        RadiusTopLeft: =RadiusLarge
                        RadiusTopRight: =RadiusLarge
                      Children:
                        - cntPaneRequesterSectionHead:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              Fill: =ColorBrandTint
                              FillPortions: =0
                              Height: =36
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutGap: =SpaceSm
                              LayoutMinHeight: =36
                              LayoutMinWidth: =0
                              PaddingLeft: =SpaceSm
                              PaddingRight: =SpaceSm
                              RadiusBottomLeft: =RadiusMedium
                              RadiusBottomRight: =RadiusMedium
                              RadiusTopLeft: =RadiusMedium
                              RadiusTopRight: =RadiusMedium
                              Width: =Parent.Width - SpaceMd * 2
                            Children:
                              - icoPaneRequesterSection:
                                  Control: ModernIcon
                                  Properties:
                                    AccessibleLabel: ="Requester information"
                                    Height: =20
                                    Icon: ="Person"
                                    IconColor: =ColorBrandAlt
                                    IconStyle: =IconStyle.Filled
                                    LayoutMinHeight: =20
                                    LayoutMinWidth: =20
                                    Width: =20
                              - lblPaneRequesterSection:
                                  Control: ModernText
                                  Properties:
                                    AccessibleLabel: =Self.Text
                                    AlignInContainer: =AlignInContainer.Center
                                    AutoHeight: =true
                                    Color: =ColorBrandAlt
                                    FillPortions: =1
                                    FontWeight: =FontWeight.Semibold
                                    Height: =22
                                    LayoutMinHeight: =22
                                    LayoutMinWidth: =0
                                    Size: =FontSizeBody
                                    Text: ="Requester information"
                                    Wrap: =false
                        - cntPaneFieldRequester:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              AlignInContainer: =AlignInContainer.Start
                              DropShadow: =DropShadow.None
                              FillPortions: =0
                              Height: =FieldHeight
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =SpaceXs
                              LayoutMinHeight: =FieldHeight
                              LayoutMinWidth: =160
                              RadiusBottomLeft: =0
                              RadiusBottomRight: =0
                              RadiusTopLeft: =0
                              RadiusTopRight: =0
                              Width: =If(Parent.Width < 520, Parent.Width - SpaceMd * 2, (Parent.Width - SpaceMd * 4) / 3 - 1)
                            Children:
                              - lblPaneFieldRequesterCaption:
                                  Control: ModernText
                                  Properties:
                                    AccessibleLabel: =Self.Text
                                    AlignInContainer: =AlignInContainer.Stretch
                                    AutoHeight: =true
                                    Color: =ColorTextSecondary
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    Size: =FontSizeCaption
                                    Text: ="Requester"
                              - lblPaneFieldRequesterValue:
                                  Control: ModernText
                                  Properties:
                                    AccessibleLabel: =Self.Text
                                    AlignInContainer: =AlignInContainer.Stretch
                                    AutoHeight: =true
                                    Color: =ColorTextPrimary
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    Size: =If(App.Width < BreakpointPhone, FontSizeBodyPhone, FontSizeBody)
                                    Text: =Coalesce(Trim(gblSelectedRequest.RequesterFirstName & " " & gblSelectedRequest.RequesterLastName), "—")
                        - cntPaneFieldEmail:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              AlignInContainer: =AlignInContainer.Start
                              DropShadow: =DropShadow.None
                              FillPortions: =0
                              Height: =FieldHeight
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =SpaceXs
                              LayoutMinHeight: =FieldHeight
                              LayoutMinWidth: =160
                              RadiusBottomLeft: =0
                              RadiusBottomRight: =0
                              RadiusTopLeft: =0
                              RadiusTopRight: =0
                              Width: =If(Parent.Width < 520, Parent.Width - SpaceMd * 2, (Parent.Width - SpaceMd * 4) / 3 - 1)
                            Children:
                              - lblPaneFieldEmailCaption:
                                  Control: ModernText
                                  Properties:
                                    AccessibleLabel: =Self.Text
                                    AlignInContainer: =AlignInContainer.Stretch
                                    AutoHeight: =true
                                    Color: =ColorTextSecondary
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    Size: =FontSizeCaption
                                    Text: ="Email"
                              - lblPaneFieldEmailValue:
                                  Control: ModernText
                                  Properties:
                                    AccessibleLabel: =Self.Text
                                    AlignInContainer: =AlignInContainer.Stretch
                                    AutoHeight: =true
                                    Color: =ColorTextPrimary
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    Size: =If(App.Width < BreakpointPhone, FontSizeBodyPhone, FontSizeBody)
                                    Text: =Coalesce(gblSelectedRequest.RequesterEmail, "—")
                        - cntPaneFieldPhone:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              AlignInContainer: =AlignInContainer.Start
                              DropShadow: =DropShadow.None
                              FillPortions: =0
                              Height: =FieldHeight
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =SpaceXs
                              LayoutMinHeight: =FieldHeight
                              LayoutMinWidth: =160
                              RadiusBottomLeft: =0
                              RadiusBottomRight: =0
                              RadiusTopLeft: =0
                              RadiusTopRight: =0
                              Width: =If(Parent.Width < 520, Parent.Width - SpaceMd * 2, (Parent.Width - SpaceMd * 4) / 3 - 1)
                            Children:
                              - lblPaneFieldPhoneCaption:
                                  Control: ModernText
                                  Properties:
                                    AccessibleLabel: =Self.Text
                                    AlignInContainer: =AlignInContainer.Stretch
                                    AutoHeight: =true
                                    Color: =ColorTextSecondary
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    Size: =FontSizeCaption
                                    Text: ="Phone"
                              - lblPaneFieldPhoneValue:
                                  Control: ModernText
                                  Properties:
                                    AccessibleLabel: =Self.Text
                                    AlignInContainer: =AlignInContainer.Stretch
                                    AutoHeight: =true
                                    Color: =ColorTextPrimary
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    Size: =If(App.Width < BreakpointPhone, FontSizeBodyPhone, FontSizeBody)
                                    Text: =Coalesce(gblSelectedRequest.RequesterPhone, "—")
                        - cntPaneRequestSectionHead:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              Fill: =ColorBrandTint
                              FillPortions: =0
                              Height: =36
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutGap: =SpaceSm
                              LayoutMinHeight: =36
                              LayoutMinWidth: =0
                              PaddingLeft: =SpaceSm
                              PaddingRight: =SpaceSm
                              RadiusBottomLeft: =RadiusMedium
                              RadiusBottomRight: =RadiusMedium
                              RadiusTopLeft: =RadiusMedium
                              RadiusTopRight: =RadiusMedium
                              Width: =Parent.Width - SpaceMd * 2
                            Children:
                              - icoPaneRequestSection:
                                  Control: ModernIcon
                                  Properties:
                                    AccessibleLabel: ="Request logistics"
                                    Height: =20
                                    Icon: ="DocumentBulletList"
                                    IconColor: =ColorBrandAlt
                                    IconStyle: =IconStyle.Filled
                                    LayoutMinHeight: =20
                                    LayoutMinWidth: =20
                                    Width: =20
                              - lblPaneRequestSection:
                                  Control: ModernText
                                  Properties:
