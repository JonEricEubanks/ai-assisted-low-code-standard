                                          Intent: ="Warning"
                                          Label: ="Due within 7 days"
                                          LayoutMaxWidth: =If(App.Width >= BreakpointDesktop, TileMaxWidth, 0)
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                          Note: ="Confirmed due dates only"
                                          OnSelect: =Set(gblStatusFilter, "In Progress"); Reset(cmbStatusFilter)
                                          Value: =Text(CountRows(Filter('FOIA Pilot Requests', DueDateConfirmed = true && DueDate <= DateAdd(Today(), 7, TimeUnit.Days))))
                                          Width: =If(App.Width < BreakpointPhone, Parent.Width, App.Width < BreakpointDesktop, (Parent.Width - Space4) / 2 - 1, (Parent.Width - Space4 * 3) / 4 - 1)
                                    - cmpTileClosed:
                                        Control: CanvasComponent
                                        ComponentName: cmpMetricTile
                                        Properties:
                                          AlignInContainer: =AlignInContainer.Start
                                          Compact: =App.Width >= BreakpointDesktop
                                          FillPortions: =If(App.Width >= BreakpointDesktop, 1, 0)
                                          Height: =If(App.Width >= BreakpointDesktop, StatStripHeight, TileHeight)
                                          Icon: ="CheckmarkCircle"
                                          Intent: ="Success"
                                          Label: ="Closed"
                                          LayoutMaxWidth: =If(App.Width >= BreakpointDesktop, TileMaxWidth, 0)
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                          Note: ="Final response sent"
                                          OnSelect: =Set(gblStatusFilter, "Closed"); Reset(cmbStatusFilter)
                                          Value: =Text(CountRows(Filter('FOIA Pilot Requests', OverallStatus.Value = "Closed")))
                                          Width: =If(App.Width < BreakpointPhone, Parent.Width, App.Width < BreakpointDesktop, (Parent.Width - Space4) / 2 - 1, (Parent.Width - Space4 * 3) / 4 - 1)
                              - cntHomeDistribution:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    Fill: =ColorSurface
                                    FillPortions: =0
                                    Height: =Space3 * 2 + Space2 + Space1 + 20
                                    LayoutAlignItems: =LayoutAlignItems.Stretch
                                    LayoutDirection: =LayoutDirection.Vertical
                                    LayoutGap: =SpaceXs
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    PaddingBottom: =Space3
                                    PaddingLeft: =Space4
                                    PaddingRight: =Space4
                                    PaddingTop: =Space3
                                    RadiusBottomLeft: =RadiusLarge
                                    RadiusBottomRight: =RadiusLarge
                                    RadiusTopLeft: =RadiusLarge
                                    RadiusTopRight: =RadiusLarge
                                    Visible: =App.Width >= BreakpointDesktop
                                  Children:
                                    - cntDistributionBar:
                                        Control: GroupContainer
                                        Variant: AutoLayout
                                        Properties:
                                          DropShadow: =DropShadow.None
                                          FillPortions: =0
                                          Height: =SpaceSm
                                          LayoutAlignItems: =LayoutAlignItems.Stretch
                                          LayoutDirection: =LayoutDirection.Horizontal
                                          LayoutGap: =2
                                          LayoutMinHeight: =SpaceSm
                                          LayoutMinWidth: =0
                                          RadiusBottomLeft: =RadiusSm
                                          RadiusBottomRight: =RadiusSm
                                          RadiusTopLeft: =RadiusSm
                                          RadiusTopRight: =RadiusSm
                                        Children:
                                          - cntSegNew:
                                              Control: GroupContainer
                                              Variant: AutoLayout
                                              Properties:
                                                DropShadow: =DropShadow.None
                                                Fill: =ColorInfo
                                                FillPortions: =CountRows(Filter('FOIA Pilot Requests', OverallStatus.Value = "New"))
                                                Height: =Parent.Height
                                                LayoutDirection: =LayoutDirection.Horizontal
                                                LayoutMinHeight: =0
                                                LayoutMinWidth: =0
                                                RadiusBottomLeft: =RadiusSm
                                                RadiusBottomRight: =RadiusSm
                                                RadiusTopLeft: =RadiusSm
                                                RadiusTopRight: =RadiusSm
                                          - cntSegInProgress:
                                              Control: GroupContainer
                                              Variant: AutoLayout
                                              Properties:
                                                DropShadow: =DropShadow.None
                                                Fill: =ColorWarning
                                                FillPortions: =CountRows(Filter('FOIA Pilot Requests', OverallStatus.Value = "In Progress"))
                                                Height: =Parent.Height
                                                LayoutDirection: =LayoutDirection.Horizontal
                                                LayoutMinHeight: =0
                                                LayoutMinWidth: =0
                                                RadiusBottomLeft: =RadiusSm
                                                RadiusBottomRight: =RadiusSm
                                                RadiusTopLeft: =RadiusSm
                                                RadiusTopRight: =RadiusSm
                                          - cntSegOnHold:
                                              Control: GroupContainer
                                              Variant: AutoLayout
                                              Properties:
                                                DropShadow: =DropShadow.None
                                                Fill: =ColorTextTertiary
                                                FillPortions: =CountRows(Filter('FOIA Pilot Requests', OverallStatus.Value = "On Hold"))
                                                Height: =Parent.Height
                                                LayoutDirection: =LayoutDirection.Horizontal
                                                LayoutMinHeight: =0
                                                LayoutMinWidth: =0
                                                RadiusBottomLeft: =RadiusSm
                                                RadiusBottomRight: =RadiusSm
                                                RadiusTopLeft: =RadiusSm
                                                RadiusTopRight: =RadiusSm
                                          - cntSegClosed:
                                              Control: GroupContainer
                                              Variant: AutoLayout
                                              Properties:
                                                DropShadow: =DropShadow.None
                                                Fill: =ColorSuccess
                                                FillPortions: =CountRows(Filter('FOIA Pilot Requests', OverallStatus.Value = "Closed"))
                                                Height: =Parent.Height
                                                LayoutDirection: =LayoutDirection.Horizontal
                                                LayoutMinHeight: =0
                                                LayoutMinWidth: =0
                                                RadiusBottomLeft: =RadiusSm
                                                RadiusBottomRight: =RadiusSm
                                                RadiusTopLeft: =RadiusSm
                                                RadiusTopRight: =RadiusSm
                                    - cntDistributionLegend:
                                        Control: GroupContainer
                                        Variant: AutoLayout
                                        Properties:
                                          DropShadow: =DropShadow.None
                                          FillPortions: =0
                                          Height: =20
                                          LayoutAlignItems: =LayoutAlignItems.Center
                                          LayoutDirection: =LayoutDirection.Horizontal
                                          LayoutGap: =SpaceMd
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                          RadiusBottomLeft: =0
                                          RadiusBottomRight: =0
                                          RadiusTopLeft: =0
                                          RadiusTopRight: =0
                                        Children:
                                          - lblLegendNew:
                                              Control: ModernText
                                              Properties:
                                                AccessibleLabel: |-
                                                  ="Status distribution: " & Self.Text
                                                AlignInContainer: =AlignInContainer.Center
                                                AutoHeight: =true
                                                Color: =ColorTextSecondary
                                                Font: =FontApp
                                                FontWeight: =FontWeight.Semibold
                                                LayoutMinHeight: =0
                                                LayoutMinWidth: =0
                                                PaddingBottom: =0
                                                PaddingLeft: =0
                                                PaddingRight: =0
                                                PaddingTop: =0
                                                Size: =FontSizeCaption
                                                Text: ="New " & CountRows(Filter('FOIA Pilot Requests', OverallStatus.Value = "New"))
                                                Width: =120
                                                Wrap: =false
                                          - lblLegendInProgress:
                                              Control: ModernText
                                              Properties:
                                                AccessibleLabel: |-
                                                  ="Status distribution: " & Self.Text
                                                AlignInContainer: =AlignInContainer.Center
                                                AutoHeight: =true
                                                Color: =ColorTextSecondary
                                                Font: =FontApp
                                                FontWeight: =FontWeight.Semibold
                                                LayoutMinHeight: =0
                                                LayoutMinWidth: =0
                                                PaddingBottom: =0
                                                PaddingLeft: =0
                                                PaddingRight: =0
                                                PaddingTop: =0
                                                Size: =FontSizeCaption
                                                Text: ="In Progress " & CountRows(Filter('FOIA Pilot Requests', OverallStatus.Value = "In Progress"))
                                                Width: =140
                                                Wrap: =false
                                          - lblLegendOnHold:
                                              Control: ModernText
                                              Properties:
                                                AccessibleLabel: |-
                                                  ="Status distribution: " & Self.Text
                                                AlignInContainer: =AlignInContainer.Center
                                                AutoHeight: =true
                                                Color: =ColorTextSecondary
                                                Font: =FontApp
                                                FontWeight: =FontWeight.Semibold
                                                LayoutMinHeight: =0
                                                LayoutMinWidth: =0
                                                PaddingBottom: =0
                                                PaddingLeft: =0
                                                PaddingRight: =0
                                                PaddingTop: =0
                                                Size: =FontSizeCaption
                                                Text: ="On Hold " & CountRows(Filter('FOIA Pilot Requests', OverallStatus.Value = "On Hold"))
                                                Width: =120
                                                Wrap: =false
                                          - lblLegendClosed:
                                              Control: ModernText
                                              Properties:
                                                AccessibleLabel: |-
                                                  ="Status distribution: " & Self.Text
                                                AlignInContainer: =AlignInContainer.Center
                                                AutoHeight: =true
                                                Color: =ColorTextSecondary
                                                Font: =FontApp
                                                FontWeight: =FontWeight.Semibold
                                                LayoutMinHeight: =0
                                                LayoutMinWidth: =0
                                                PaddingBottom: =0
                                                PaddingLeft: =0
                                                PaddingRight: =0
                                                PaddingTop: =0
                                                Size: =FontSizeCaption
                                                Text: ="Closed " & CountRows(Filter('FOIA Pilot Requests', OverallStatus.Value = "Closed"))
                                                Width: =120
                                                Wrap: =false
                              - cntHomeMasterDetail:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    FillPortions: =If(App.Width >= BreakpointDesktop, 1, 0)
                                    Height: |-
                                      =If(App.Width >= BreakpointDesktop,
                                        Parent.Height,
                                        cntHomeFilters.Height +
                                        If(lblQueueLoading.Visible, lblQueueLoading.Height, 0) +
                                        If(lblQueueError.Visible, lblQueueError.Height, 0) +
                                        If(lblQueuePermission.Visible, lblQueuePermission.Height, 0) +
                                        If(cmpHomeEmpty.Visible, 240 + Space2, 0) +
                                        Max(0, galRequests.AllItemsCount * (If(App.Width < BreakpointPhone, 92, 80) + SpaceXs * 2)) +
                                        SpaceSm * 5)
                                    LayoutAlignItems: =LayoutAlignItems.Stretch
                                    LayoutDirection: =If(App.Width >= BreakpointDesktop, LayoutDirection.Horizontal, LayoutDirection.Vertical)
                                    LayoutGap: =SpaceMd
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    RadiusBottomLeft: =0
                                    RadiusBottomRight: =0
                                    RadiusTopLeft: =0
                                    RadiusTopRight: =0
                                  Children:
                                    - cntHomeListPane:
                                        Control: GroupContainer
                                        Variant: AutoLayout
                                        Properties:
                                          DropShadow: =DropShadow.None
                                          FillPortions: =0
                                          Height: |-
                                            =If(App.Width >= BreakpointDesktop,
                                              Parent.Height,
                                              cntHomeFilters.Height +
                                              If(lblQueueLoading.Visible, lblQueueLoading.Height, 0) +
                                              If(lblQueueError.Visible, lblQueueError.Height, 0) +
                                              If(lblQueuePermission.Visible, lblQueuePermission.Height, 0) +
                                              If(cmpHomeEmpty.Visible, 240 + Space2, 0) +
                                              Max(0, galRequests.AllItemsCount * (If(App.Width < BreakpointPhone, 92, 80) + SpaceXs * 2)) +
                                              SpaceSm * 5)
                                          LayoutAlignItems: =LayoutAlignItems.Stretch
                                          LayoutDirection: =LayoutDirection.Vertical
                                          LayoutGap: =SpaceSm
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =320
                                          RadiusBottomLeft: =0
                                          RadiusBottomRight: =0
                                          RadiusTopLeft: =0
                                          RadiusTopRight: =0
                                          Width: =If(App.Width >= BreakpointDesktop, Parent.Width * ListPaneRatio, Parent.Width)
                                        Children:
                                          - cntHomeFilters:
                                              Control: GroupContainer
                                              Variant: AutoLayout
                                              Properties:
                                                DropShadow: =DropShadow.None
                                                FillPortions: =0
                                                Height: =InputHeight * If(App.Width < BreakpointPhone, 2, 3) + Space2 * 2 + If(btnResetFilters.Visible, InputHeight + Space2, 0)
                                                LayoutAlignItems: =LayoutAlignItems.Stretch
                                                LayoutDirection: =LayoutDirection.Vertical
                                                LayoutGap: =SpaceSm
                                                LayoutMinHeight: =0
                                                LayoutMinWidth: =0
                                                RadiusBottomLeft: =0
                                                RadiusBottomRight: =0
                                                RadiusTopLeft: =0
                                                RadiusTopRight: =0
                                              Children:
                                                - txtSearch:
                                                    Control: ModernTextInput
                                                    Properties:
                                                      AccessibleLabel: ="Search requests"
                                                      AlignInContainer: =AlignInContainer.Stretch
                                                      Appearance: =Appearance.FilledLighter
                                                      Font: =FontApp
                                                      Height: =InputHeight
                                                      LayoutMinHeight: =InputHeight
                                                      OnChange: =Set(gblSearchText, Self.Text)
                                                      Placeholder: ="Search requests…"
                                                      RadiusBottomLeft: =RadiusLarge
                                                      RadiusBottomRight: =RadiusLarge
                                                      RadiusTopLeft: =RadiusLarge
                                                      RadiusTopRight: =RadiusLarge
                                                      Size: =If(App.Width < BreakpointPhone, FontSizeBodyPhone, FontSizeBody)
                                                      TriggerOutput: =TriggerOutput.Delayed
                                                      Type: =TextInputType.Search
                                                - cmbStatusFilter:
                                                    Control: ModernDropdown
                                                    Properties:
                                                      AccessibleLabel: ="Filter requests by status"
                                                      AlignInContainer: =AlignInContainer.Stretch
                                                      Default: =LookUp(["All", "New", "In Progress", "On Hold", "Closed"], Value = gblStatusFilter)
                                                      Font: =FontApp
                                                      Height: =InputHeight
                                                      ItemDisplayText: |-
                                                        ="Status: " & ThisItem.Value
                                                      Items: =["All", "New", "In Progress", "On Hold", "Closed"]
                                                      LayoutMinHeight: =InputHeight
                                                      OnChange: =Set(gblStatusFilter, Self.Selected.Value)
                                                      RadiusBottomLeft: =RadiusLarge
                                                      RadiusBottomRight: =RadiusLarge
                                                      RadiusTopLeft: =RadiusLarge
                                                      RadiusTopRight: =RadiusLarge
                                                      Size: =If(App.Width < BreakpointPhone, FontSizeBodyPhone, FontSizeBody)
                                                - cmbDepartmentFilter:
                                                    Control: ModernDropdown
                                                    Properties:
                                                      AccessibleLabel: ="Filter requests by department"
                                                      AlignInContainer: =AlignInContainer.Stretch
                                                      Default: |-
                                                        =LookUp(Ungroup(Table({Options: Table({Value: "All"})}, {Options: Distinct(Filter('FOIA Pilot Departments', Active = true), Title)}), Options), Value = gblDepartmentFilter)
                                                      Font: =FontApp
                                                      Height: =InputHeight
                                                      ItemDisplayText: |-
                                                        ="Department: " & ThisItem.Value
                                                      Items: |-
                                                        =Ungroup(Table({Options: Table({Value: "All"})}, {Options: Distinct(Filter('FOIA Pilot Departments', Active = true), Title)}), Options)
                                                      LayoutMinHeight: =InputHeight
                                                      OnChange: =Set(gblDepartmentFilter, Self.Selected.Value)
                                                      RadiusBottomLeft: =RadiusLarge
                                                      RadiusBottomRight: =RadiusLarge
                                                      RadiusTopLeft: =RadiusLarge
                                                      RadiusTopRight: =RadiusLarge
                                                      Size: =If(App.Width < BreakpointPhone, FontSizeBodyPhone, FontSizeBody)
                                                      Visible: =App.Width >= BreakpointPhone
                                                - btnResetFilters:
                                                    Control: ModernButton
                                                    Properties:
                                                      AccessibleLabel: ="Reset filters"
                                                      AlignInContainer: =AlignInContainer.Stretch
                                                      Appearance: =ButtonAppearance.Subtle
                                                      Font: =FontApp
                                                      Height: =InputHeight
                                                      Icon: ="ArrowReset"
                                                      LayoutMinHeight: =InputHeight
                                                      OnSelect: |-
                                                        =Set(gblStatusFilter, "All");
                                                        Set(gblDepartmentFilter, "All");
                                                        Set(gblSearchText, "");
                                                        Reset(txtSearch);
                                                        Reset(cmbStatusFilter);
                                                        Reset(cmbDepartmentFilter)
                                                      Size: =FontSizeBody
                                                      Text: ="Reset"
                                                      Tooltip: ="Clear search and filters"
                                                      Visible: =gblStatusFilter <> "All" || gblDepartmentFilter <> "All" || !IsBlank(gblSearchText)
                                          - lblQueueLoading:
                                              Control: ModernText
                                              Properties:
                                                AccessibleLabel: =Self.Text
                                                AlignInContainer: =AlignInContainer.Stretch
                                                AutoHeight: =true
                                                Color: =ColorTextSecondary
                                                LayoutMinHeight: =0
                                                LayoutMinWidth: =0
                                                PaddingBottom: =0
                                                PaddingLeft: =0
                                                PaddingRight: =0
                                                PaddingTop: =0
                                                Size: =If(App.Width < BreakpointPhone, FontSizeBodyPhone, FontSizeBody)
                                                Text: ="Loading requests…"
                                                Visible: =gblIsLoading
                                          - lblQueueError:
                                              Control: ModernText
                                              Properties:
                                                AccessibleLabel: =Self.Text
                                                AlignInContainer: =AlignInContainer.Stretch
                                                AutoHeight: =true
                                                Color: =ColorCritical
                                                LayoutMinHeight: =0
                                                LayoutMinWidth: =0
                                                PaddingBottom: =0
                                                PaddingLeft: =0
                                                PaddingRight: =0
                                                PaddingTop: =0
                                                Size: =If(App.Width < BreakpointPhone, FontSizeBodyPhone, FontSizeBody)
                                                Text: ="We couldn't load the request queue. Select Refresh to try again."
                                                Visible: =gblLoadError && !gblPermissionDenied
                                          - lblQueuePermission:
                                              Control: ModernText
                                              Properties:
                                                AccessibleLabel: =Self.Text
                                                AlignInContainer: =AlignInContainer.Stretch
                                                AutoHeight: =true
                                                Color: =ColorWarning
                                                LayoutMinHeight: =0
                                                LayoutMinWidth: =0
                                                PaddingBottom: =0
                                                PaddingLeft: =0
                                                PaddingRight: =0
                                                PaddingTop: =0
                                                Size: =If(App.Width < BreakpointPhone, FontSizeBodyPhone, FontSizeBody)
                                                Text: ="You don't have permission to view FOIA requests. Contact a site owner for access."
                                                Visible: =gblPermissionDenied
                                          - lblQueueEmpty:
                                              Control: ModernText
                                              Properties:
                                                AccessibleLabel: =Self.Text
                                                AlignInContainer: =AlignInContainer.Stretch
                                                AutoHeight: =true
                                                Color: =ColorTextSecondary
                                                LayoutMinHeight: =0
                                                LayoutMinWidth: =0
                                                PaddingBottom: =0
                                                PaddingLeft: =0
                                                PaddingRight: =0
                                                PaddingTop: =0
                                                Size: =If(App.Width < BreakpointPhone, FontSizeBodyPhone, FontSizeBody)
                                                Text: ="No requests match these filters."
                                                Visible: =false
                                          - galRequests:
                                              Control: Gallery
                                              Variant: Vertical
                                              Properties:
                                                AccessibleLabel: ="FOIA requests"
                                                FillPortions: =0
                                                Height: |-
                                                  =If(App.Width >= BreakpointDesktop,
                                                    If(Self.AllItemsCount = 0, 0,
                                                      Max(0,
                                                        Parent.Height - cntHomeFilters.Height -
                                                        If(lblQueueLoading.Visible, lblQueueLoading.Height, 0) -
                                                        If(lblQueueError.Visible, lblQueueError.Height, 0) -
                                                        If(lblQueuePermission.Visible, lblQueuePermission.Height, 0) -
                                                        If(lblQueueEmpty.Visible, lblQueueEmpty.Height, 0) -
                                                        SpaceSm * 5)),
                                                    Max(0, Self.AllItemsCount * (If(App.Width < BreakpointPhone, 92, 80) + SpaceXs * 2)))
                                                Items: |-
                                                  =SortByColumns(
                                                    Filter(
                                                      'FOIA Pilot Requests',
                                                      (gblStatusFilter = "All" || OverallStatus.Value = gblStatusFilter) &&
                                                      (gblDepartmentFilter = "All" || PrimaryDepartment.Value = gblDepartmentFilter) &&
                                                      (IsBlank(gblSearchText) ||
                                                        StartsWith(Title, gblSearchText) ||
                                                        StartsWith(RequesterLastName, gblSearchText) ||
                                                        StartsWith(RequestDescription, gblSearchText))
                                                    ),
                                                    "ReceivedDate",
                                                    SortOrder.Descending
                                                  )
                                                LayoutMinHeight: =0
                                                LayoutMinWidth: =0
                                                LoadingSpinner: =LoadingSpinner.Controls
                                                LoadingSpinnerColor: =ColorBrand
                                                OnSelect: |-
                                                  =Set(gblSelectedRequest, ThisItem);
                                                  If(App.Width < BreakpointDesktop, Navigate(RequestDetail, ScreenTransition.Fade))
                                                ShowScrollbar: =App.Width >= BreakpointDesktop
                                                TabIndex: =0
                                                TemplatePadding: =SpaceXs
                                                TemplateSize: =If(App.Width < BreakpointPhone, 92, 80)
                                                Visible: =!gblIsLoading && !gblLoadError && !gblPermissionDenied
                                                Width: =Parent.Width
                                              Children:
                                                - cntRequestRow:
                                                    Control: GroupContainer
                                                    Variant: AutoLayout
                                                    Properties:
                                                      BorderColor: =ColorNeutralStroke
                                                      Fill: =If(ThisItem.ID = gblSelectedRequest.ID, ColorBrandTint, ColorSurface)
                                                      Height: =Parent.TemplateHeight
                                                      LayoutAlignItems: =LayoutAlignItems.Center
                                                      LayoutDirection: =LayoutDirection.Horizontal
                                                      LayoutGap: =SpaceMd
                                                      PaddingBottom: =SpaceSm
                                                      PaddingLeft: =Space4 + StatusAccentWidth
                                                      PaddingRight: =SpaceMd
                                                      PaddingTop: =SpaceSm
                                                      RadiusBottomLeft: =0
                                                      RadiusBottomRight: =RadiusMedium
                                                      RadiusTopLeft: =0
                                                      RadiusTopRight: =RadiusMedium
                                                      Width: =Parent.TemplateWidth
                                                    Children:
                                                      - cntRequestRowText:
                                                          Control: GroupContainer
                                                          Variant: AutoLayout
                                                          Properties:
                                                            DropShadow: =DropShadow.None
                                                            LayoutAlignItems: =LayoutAlignItems.Stretch
                                                            LayoutDirection: =LayoutDirection.Vertical
                                                            LayoutGap: =SpaceXs
                                                            LayoutJustifyContent: =LayoutJustifyContent.Center
                                                            LayoutMinHeight: =0
                                                            LayoutMinWidth: =120
                                                            RadiusBottomLeft: =0
                                                            RadiusBottomRight: =0
                                                            RadiusTopLeft: =0
                                                            RadiusTopRight: =0
                                                          Children:
                                                            - lblRequestRowTitle:
                                                                Control: ModernText
                                                                Properties:
                                                                  AccessibleLabel: =Self.Text
                                                                  AlignInContainer: =AlignInContainer.Stretch
                                                                  AutoHeight: =true
                                                                  Color: =ColorTextPrimary
                                                                  FontWeight: =FontWeight.Semibold
                                                                  LayoutMinHeight: =0
                                                                  LayoutMinWidth: =0
                                                                  OnSelect: |-
                                                                    =Set(gblSelectedRequest, ThisItem);
                                                                      If(App.Width < BreakpointDesktop, Navigate(RequestDetail, ScreenTransition.Fade))
                                                                  PaddingBottom: =0
                                                                  PaddingLeft: =0
                                                                  PaddingRight: =0
                                                                  PaddingTop: =0
                                                                  Size: =If(App.Width < BreakpointPhone, FontSizeBodyPhone, FontSizeBody)
                                                                  Text: =Coalesce(ThisItem.Title, "Untitled request")
                                                                  Wrap: =false
                                                            - lblRequestRowMeta:
                                                                Control: ModernText
                                                                Properties:
                                                                  AccessibleLabel: =Self.Text
                                                                  AlignInContainer: =AlignInContainer.Stretch
                                                                  AutoHeight: =true
                                                                  Color: =ColorTextSecondary
                                                                  LayoutMinHeight: =0
                                                                  LayoutMinWidth: =0
                                                                  OnSelect: |-
                                                                    =Set(gblSelectedRequest, ThisItem);
                                                                      If(App.Width < BreakpointDesktop, Navigate(RequestDetail, ScreenTransition.Fade))
                                                                  PaddingBottom: =0
                                                                  PaddingLeft: =0
                                                                  PaddingRight: =0
                                                                  PaddingTop: =0
                                                                  Size: =FontSizeCaption
                                                                  Text: |-
                                                                    =ThisItem.RequesterFirstName & " " & ThisItem.RequesterLastName &
                                                                    " · Received " & If(IsBlank(ThisItem.ReceivedDate), "—", Text(ThisItem.ReceivedDate, "mmm d, yyyy")) &
                                                                    If(App.Width < BreakpointPhone, " · " & Coalesce(ThisItem.OverallStatus.Value, "Not set"), "")
                                                      - bdgRequestRowStatus:
                                                          Control: ModernBadge
                                                          Properties:
                                                            AccessibleLabel: |-
                                                              ="Status: " & Coalesce(ThisItem.OverallStatus.Value, "Not set")
                                                            AlignInContainer: =AlignInContainer.Center
                                                            Content: =Coalesce(ThisItem.OverallStatus.Value, "Not set")
                                                            Font: =FontApp
                                                            FontWeight: =FontWeight.Semibold
                                                            Height: =24
                                                            Icon: |-
                                                              =Switch(ThisItem.OverallStatus.Value,
                                                                "New", "Info",
                                                                "In Progress", "ArrowClockwise",
                                                                "On Hold", "Pause",
                                                                "Ready", "Checkmark",
                                                                "Delivered", "Send",
                                                                "Closed", "CheckmarkCircle",
                                                                "Complete", "CheckmarkCircle",
                                                                "Overdue", "Warning",
                                                                "Circle")
                                                            Intent: |-
                                                              =Switch(ThisItem.OverallStatus.Value,
                                                                "New", BadgeIntent.Informative,
                                                                "In Progress", BadgeIntent.Caution,
                                                                "On Hold", BadgeIntent.Attention,
                                                                "Ready", BadgeIntent.Attention,
                                                                "Delivered", BadgeIntent.Positive,
                                                                "Closed", BadgeIntent.Positive,
                                                                "Complete", BadgeIntent.Positive,
                                                                "Overdue", BadgeIntent.Critical,
                                                                BadgeIntent.Neutral)
                                                            LayoutMinHeight: =24
                                                            LayoutMinWidth: =112
                                                            RadiusBottomLeft: =RadiusMedium
                                                            RadiusBottomRight: =RadiusMedium
                                                            RadiusTopLeft: =RadiusMedium
                                                            RadiusTopRight: =RadiusMedium
                                                            Shape: =BadgeShape.Rounded
                                                            Size: =12
                                                            Visible: =App.Width >= BreakpointPhone
                                                            Width: =112
                                                      - btnRequestRowOpen:
                                                          Control: ModernButton
                                                          Properties:
                                                            AccessibleLabel: ="Open request " & ThisItem.Title
                                                            AlignInContainer: =AlignInContainer.Center
                                                            Appearance: =ButtonAppearance.Transparent
                                                            Color: =ColorTextTertiary
                                                            Font: =FontApp
                                                            Height: =ControlMinTouch
                                                            Icon: ="ChevronRight"
                                                            Layout: =ButtonLayout.IconOnly
                                                            LayoutMinHeight: =ControlMinTouch
                                                            LayoutMinWidth: =32
                                                            OnSelect: |-
                                                              =Set(gblSelectedRequest, ThisItem);
                                                                If(App.Width < BreakpointDesktop, Navigate(RequestDetail, ScreenTransition.Fade))
                                                            Text: ="Open"
                                                            Tooltip: ="Open request"
                                                            Width: =32
                                                - recRequestAccent:
                                                    Control: Rectangle
                                                    Properties:
                                                      Fill: |-
                                                        =Switch(ThisItem.OverallStatus.Value,
                                                          "New", ColorInfo,
                                                          "In Progress", ColorWarning,
                                                          "On Hold", ColorTextTertiary,
                                                          "Ready", ColorBrand,
                                                          "Delivered", ColorSuccess,
                                                          "Closed", ColorSuccess,
                                                          "Overdue", ColorDanger,
                                                          ColorBorder)
                                                      Height: =Parent.TemplateHeight
                                                      Width: =StatusAccentWidth
                                          - cmpHomeEmpty:
                                              Control: CanvasComponent
                                              ComponentName: cmpEmptyState
                                              Properties:
                                                ActionIcon: ="Add"
                                                ActionText: =If(gblStatusFilter <> "All" || gblDepartmentFilter <> "All" || !IsBlank(gblSearchText), "Reset filters", "New request")
