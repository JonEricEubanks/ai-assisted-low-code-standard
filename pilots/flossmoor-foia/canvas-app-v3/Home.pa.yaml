                                                PaddingRight: =0
                                                PaddingTop: =0
                                                Size: =FontSizeCaption
                                                Text: ="Open / in progress"
                                                Visible: =App.Width < BreakpointDesktop
                                                Wrap: =false
                                    - cntTileDueSoon:
