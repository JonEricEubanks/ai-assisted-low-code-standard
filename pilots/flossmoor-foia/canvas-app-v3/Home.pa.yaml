                                                      PaddingLeft: =0
                                                      PaddingRight: =0
                                                      PaddingTop: =0
                                                      Size: =FontSizeCaption
                                                      Text: ="Open"
                                                      Wrap: =false
                                          - lblTileOpenValue:
                                              Control: ModernText
