                                          DropShadow: =DropShadow.None
                                          Fill: =ColorSurface
                                          FillPortions: =0
                                          Height: =If(App.Width >= BreakpointDesktop, StatStripHeight, TileHeight)
                                          LayoutAlignItems: =If(App.Width >= BreakpointDesktop, LayoutAlignItems.Center, LayoutAlignItems.Stretch)
                                          LayoutDirection: =If(App.Width >= BreakpointDesktop, LayoutDirection.Horizontal, LayoutDirection.Vertical)
                                          LayoutGap: =If(App.Width >= BreakpointDesktop, SpaceMd, 2)
                                          LayoutMaxWidth: =If(App.Width >= BreakpointDesktop, TileMaxWidth, 0)
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                          PaddingBottom: =If(App.Width >= BreakpointDesktop, SpaceSm, SpaceSm + SpaceXs)
                                          PaddingLeft: =SpaceMd
                                          PaddingRight: =SpaceMd
                                          PaddingTop: =If(App.Width >= BreakpointDesktop, SpaceSm, SpaceSm + SpaceXs)
                                          RadiusBottomLeft: =RadiusSm
                                          RadiusBottomRight: =RadiusSm
                                          RadiusTopLeft: =RadiusSm
                                          RadiusTopRight: =RadiusSm
                                          Visible: =false
                                          Width: =If(App.Width < BreakpointPhone, Parent.Width, App.Width < BreakpointDesktop, (Parent.Width - SpaceMd) / 2 - 1, (Parent.Width - SpaceMd * 3) / 4 - 1)
                                        Children:
                                          - cntTileDueSoonHead:
                                              Control: GroupContainer
                                              Variant: AutoLayout
                                              Properties:
