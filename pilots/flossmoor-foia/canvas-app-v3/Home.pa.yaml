Screens:
  Home:
    Properties:
      Fill: =ColorCanvas
      LoadingSpinnerColor: =ColorBrand
      OnVisible: |-
        =Set(gblIsLoading, false);
        Set(gblLoadError, false);
        Set(gblPermissionDenied, false);
        Set(gblSearchText, "");
        Set(gblStatusFilter, "All");
        Set(gblDepartmentFilter, "All")
    Children:
      - cntHomeShell:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =ColorCanvas
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Vertical
            LayoutGap: =Space2
            PaddingBottom: =Space2
            PaddingLeft: =Space2
            PaddingRight: =Space2
            PaddingTop: =Space2
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =Parent.Width
          Children:
            - cmpHomeHeader:
                Control: CanvasComponent
                ComponentName: cmpAppHeader
                Properties:
                  AlignInContainer: =AlignInContainer.Stretch
                  Height: =HeaderHeight
                  LayoutMinHeight: =HeaderHeight
                  LayoutMinWidth: =0
                  OnBack: =false
                  OnPrimary: =Navigate(NewRequest, ScreenTransition.Fade)
                  OnSecondary: |-
                    =Set(gblIsLoading, true);
                    Set(gblLoadError, false);
                    Refresh('FOIA Pilot Requests');
                    Set(gblIsLoading, false);
                    cmpToastHostHome.SendToast("Queue refreshed", "", "Info", 0, true, true, true)
                  PrimaryIcon: ="Add"
                  PrimaryLabel: ="New request"
                  SecondaryIcon: ="ArrowClockwise"
                  SecondaryLabel: ="Refresh"
                  ShowBack: =false
                  Subtitle: ="Village of Flossmoor · Request queue and response readiness"
                  Title: ="FOIA requests"
            - cntHomeBody:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =ColorCanvas
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =Space2
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                Children:
                  - cmpHomeNavRail:
                      Control: CanvasComponent
                      ComponentName: cmpSideNav
                      Properties:
                        ActiveScreen: ="Home"
                        AlignInContainer: =AlignInContainer.Stretch
                        Expanded: =gblNavExpanded
                        Height: =Parent.Height
                        LayoutMinHeight: =0
                        LayoutMinWidth: =RailWidth
                        Placement: ="Rail"
                        Visible: =App.Width >= BreakpointPhone
                        Width: =If(gblNavExpanded, RailWidthExpanded, RailWidth)
                  - cntHomeContentOuter:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =ColorCanvas
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                      Children:
                        - cntHomeContent:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              AlignInContainer: =AlignInContainer.Center
                              DropShadow: =DropShadow.None
                              Fill: =ColorCanvas
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =SpaceMd
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              LayoutOverflowY: =If(App.Width >= BreakpointDesktop, LayoutOverflow.Hide, LayoutOverflow.Scroll)
                              PaddingBottom: =If(App.Width < BreakpointPhone, Space3, Space4)
                              PaddingLeft: =If(App.Width < BreakpointPhone, Space4, App.Width < BreakpointDesktop, Space5, Max(Space5, (Parent.Width - ContentMaxWidth) / 2))
                              PaddingRight: =If(App.Width < BreakpointPhone, Space4, App.Width < BreakpointDesktop, Space5, Max(Space5, (Parent.Width - ContentMaxWidth) / 2))
                              PaddingTop: =If(App.Width < BreakpointPhone, Space3, Space4)
                              RadiusBottomLeft: =0
                              RadiusBottomRight: =0
                              RadiusTopLeft: =0
                              RadiusTopRight: =0
                              Width: =Min(Parent.Width, ContentMaxWidth)
                            Children:
                              - cntHomeKpis:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    FillPortions: =0
                                    Height: =If(App.Width < BreakpointPhone, TileHeight * 4 + SpaceMd * 3, App.Width < BreakpointDesktop, TileHeight * 2 + SpaceMd, StatStripHeight)
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutGap: =SpaceMd
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    LayoutWrap: =App.Width < BreakpointDesktop
                                    RadiusBottomLeft: =0
                                    RadiusBottomRight: =0
                                    RadiusTopLeft: =0
                                    RadiusTopRight: =0
                                  Children:
                                    - cntTileTotal:
                                        Control: GroupContainer
                                        Variant: AutoLayout
                                        Properties:
                                          AlignInContainer: =AlignInContainer.Start
                                          BorderColor: =ColorNeutralStroke
                                          BorderThickness: =1
                                          DropShadow: =DropShadow.None
                                          Fill: =ColorSurface
                                          FillPortions: =0
                                          Height: =If(App.Width >= BreakpointDesktop, StatStripHeight, TileHeight)
                                          LayoutAlignItems: =If(App.Width >= BreakpointDesktop, LayoutAlignItems.Center, LayoutAlignItems.Stretch)
                                          LayoutDirection: =If(App.Width >= BreakpointDesktop, LayoutDirection.Horizontal, LayoutDirection.Vertical)
                                          LayoutGap: =If(App.Width >= BreakpointDesktop, SpaceMd, 2)
                                          LayoutMaxWidth: =If(App.Width >= BreakpointDesktop, TileMaxWidth, 0)
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                          PaddingBottom: =If(App.Width >= BreakpointDesktop, SpaceSm, SpaceSm + SpaceXs)
                                          PaddingLeft: =SpaceMd
                                          PaddingRight: =SpaceMd
                                          PaddingTop: =If(App.Width >= BreakpointDesktop, SpaceSm, SpaceSm + SpaceXs)
                                          RadiusBottomLeft: =RadiusSm
                                          RadiusBottomRight: =RadiusSm
                                          RadiusTopLeft: =RadiusSm
                                          RadiusTopRight: =RadiusSm
                                          Visible: =false
                                          Width: =If(App.Width < BreakpointPhone, Parent.Width, App.Width < BreakpointDesktop, (Parent.Width - SpaceMd) / 2 - 1, (Parent.Width - SpaceMd * 3) / 4 - 1)
                                        Children:
                                          - cntTileTotalHead:
                                              Control: GroupContainer
                                              Variant: AutoLayout
                                              Properties:
                                                AlignInContainer: =If(App.Width >= BreakpointDesktop, AlignInContainer.Center, AlignInContainer.Stretch)
                                                DropShadow: =DropShadow.None
                                                FillPortions: =0
                                                Height: =20
                                                LayoutAlignItems: =LayoutAlignItems.Center
                                                LayoutDirection: =LayoutDirection.Horizontal
                                                LayoutGap: =SpaceSm
                                                LayoutMinHeight: =0
                                                LayoutMinWidth: =0
                                                RadiusBottomLeft: =0
                                                RadiusBottomRight: =0
                                                RadiusTopLeft: =0
                                                RadiusTopRight: =0
                                                Width: =If(App.Width >= BreakpointDesktop, 150, Parent.Width - SpaceMd * 2)
                                              Children:
                                                - icoTileTotal:
                                                    Control: ModernIcon
                                                    Properties:
                                                      AccessibleLabel: ="Total requests"
                                                      AlignInContainer: =AlignInContainer.Center
                                                      Height: =20
                                                      Icon: ="Document"
                                                      IconColor: =ColorBrand
                                                      LayoutMinHeight: =20
                                                      LayoutMinWidth: =20
                                                      Width: =20
                                                - lblTileTotalCaption:
