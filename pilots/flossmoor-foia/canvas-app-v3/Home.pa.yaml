                                                      Icon: ="DocumentSearch"
                                                      IconColor: =ColorTextSecondary
                                                      LayoutMinHeight: =48
                                                      LayoutMinWidth: =48
                                                      Width: =48
                                                - lblDetailEmptyTitle:
                                                    Control: ModernText
                                                    Properties:
                                                      AccessibleLabel: =Self.Text
                                                      Align: =Align.Center
                                                      AlignInContainer: =AlignInContainer.Center
                                                      AutoHeight: =true
                                                      Color: =ColorTextPrimary
                                                      FontWeight: =FontWeight.Semibold
                                                      LayoutMinHeight: =0
                                                      LayoutMinWidth: =0
                                                      PaddingBottom: =0
                                                      PaddingLeft: =0
                                                      PaddingRight: =0
                                                      PaddingTop: =0
                                                      Size: =FontSizeSection
                                                      Text: ="Select a request"
                                                      Width: =320
                                                      Wrap: =false
                                                - lblDetailEmptyHint:
                                                    Control: ModernText
                                                    Properties:
                                                      AccessibleLabel: =Self.Text
                                                      Align: =Align.Center
                                                      AlignInContainer: =AlignInContainer.Center
                                                      AutoHeight: =true
                                                      Color: =ColorTextSecondary
                                                      LayoutMinHeight: =0
                                                      LayoutMinWidth: =0
                                                      PaddingBottom: =0
                                                      PaddingLeft: =0
                                                      PaddingRight: =0
                                                      PaddingTop: =0
