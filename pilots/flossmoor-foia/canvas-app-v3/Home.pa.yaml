                                                AccessibleLabel: |-
                                                  ="Open requests: " & Self.Text
                                                Align: =If(App.Width >= BreakpointDesktop, Align.Right, Align.Left)
                                                AlignInContainer: =If(App.Width >= BreakpointDesktop, AlignInContainer.Center, AlignInContainer.Stretch)
