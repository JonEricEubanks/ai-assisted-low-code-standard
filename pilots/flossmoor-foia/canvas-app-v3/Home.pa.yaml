                                                LayoutMinWidth: =0
                                                RadiusBottomLeft: =0
                                                RadiusBottomRight: =0
                                                RadiusTopLeft: =0
                                                RadiusTopRight: =0
                                                Width: =If(App.Width >= BreakpointDesktop, 150, Parent.Width - SpaceMd * 2)
                                              Children:
                                                - icoTileDueSoon:
                                                    Control: ModernIcon
                                                    Properties:
                                                      AccessibleLabel: ="Due within 7 days"
                                                      AlignInContainer: =AlignInContainer.Center
                                                      Height: =20
                                                      Icon: ="Warning"
                                                      IconColor: =ColorWarning
                                                      LayoutMinHeight: =20
                                                      LayoutMinWidth: =20
                                                      Width: =20
                                                - lblTileDueSoonCaption:
                                                    Control: ModernText
                                                    Properties:
                                                      AccessibleLabel: =Self.Text
                                                      AlignInContainer: =AlignInContainer.Center
                                                      AutoHeight: =true
                                                      Color: =ColorTextSecondary
                                                      FillPortions: =1
                                                      LayoutMinHeight: =0
                                                      LayoutMinWidth: =0
                                                      PaddingBottom: =0
                                                      PaddingLeft: =0
                                                      PaddingRight: =0
                                                      PaddingTop: =0
                                                      Size: =FontSizeCaption
                                                      Text: ="Due within 7 days"
                                                      Wrap: =false
                                          - lblTileDueSoonValue:
                                              Control: ModernText
                                              Properties:
                                                AccessibleLabel: |-
                                                  ="Due within 7 days: " & Self.Text
                                                Align: =If(App.Width >= BreakpointDesktop, Align.Right, Align.Left)
                                                AlignInContainer: =If(App.Width >= BreakpointDesktop, AlignInContainer.Center, AlignInContainer.Stretch)
                                                AutoHeight: =true
                                                Color: =ColorTextPrimary
                                                FillPortions: =If(App.Width >= BreakpointDesktop, 1, 0)
                                                FontWeight: =FontWeight.Semibold
                                                LayoutMinHeight: =0
                                                LayoutMinWidth: =0
                                                PaddingBottom: =0
                                                PaddingLeft: =0
                                                PaddingRight: =0
                                                PaddingTop: =0
                                                Size: =If(App.Width < BreakpointPhone, FontSizeKpiPhone, App.Width < BreakpointDesktop, FontSizeKpiTablet, FontSizeKpiDesktop)
                                                Text: =Text(CountRows(Filter('FOIA Pilot Requests', DueDateConfirmed = true && DueDate <= DateAdd(Today(), 7, TimeUnit.Days))))
                                                Wrap: =false
                                          - lblTileDueSoonNote:
                                              Control: ModernText
                                              Properties:
                                                AccessibleLabel: =Self.Text
                                                AlignInContainer: =AlignInContainer.Stretch
                                                AutoHeight: =true
                                                Color: =ColorTextSecondary
