                                                PaddingRight: =PagePaddingWide
                                                PaddingTop: =PagePaddingWide
                                                RadiusBottomLeft: =RadiusLarge
                                                RadiusBottomRight: =RadiusLarge
                                                RadiusTopLeft: =RadiusLarge
                                                RadiusTopRight: =RadiusLarge
                                                Visible: =IsBlank(gblSelectedRequest)
                                              Children:
                                                - icoDetailEmpty:
                                                    Control: ModernIcon
