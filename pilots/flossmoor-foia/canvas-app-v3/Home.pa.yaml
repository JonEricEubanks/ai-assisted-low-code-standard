                                                LayoutDirection: =LayoutDirection.Horizontal
                                                LayoutGap: =SpaceSm
                                                LayoutMinHeight: =0
                                                LayoutMinWidth: =0
                                                RadiusBottomLeft: =0
                                                RadiusBottomRight: =0
                                                RadiusTopLeft: =0
                                                RadiusTopRight: =0
                                                Width: =If(App.Width >= BreakpointDesktop, 150, Parent.Width - SpaceMd * 2)
