Screens:
  NewRequest:
    Properties:
      Fill: =ColorNeutralBg
      LoadingSpinnerColor: =ColorBrand
      OnVisible: |-
        =Set(gblIsLoading, false);
        Set(gblLoadError, false);
        Set(gblSaveSuccess, false);
        Set(gblDueDateConfirmed, false);
        Reset(txtRequesterFirstName);
        Reset(txtRequesterLastName);
        Reset(txtRequesterEmail);
        Reset(txtRequesterPhone);
        Reset(txtRequestDescription);
        Reset(cmbPrimaryDepartment);
        Reset(cmbIntakeMethod);
        Reset(cmbRequestRoute);
        Reset(cmbDeliveryFormat);
        Reset(datReceivedDate);
        Reset(datDueDate);
        Reset(chkDueDateConfirmed);
        Reset(chkCertifiedCopies);
        Reset(chkFeeWaiverRequested)
    Children:
      - cntNewRequestShell:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =ColorNeutralBg
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Vertical
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =Parent.Width
          Children:
            - cmpNewRequestHeader:
                Control: CanvasComponent
                ComponentName: cmpAppHeader
                Properties:
                  AlignInContainer: =AlignInContainer.Stretch
                  Height: =HeaderHeight
                  LayoutMinHeight: =HeaderHeight
                  LayoutMinWidth: =0
                  OnBack: =Navigate(Home, ScreenTransition.None)
                  OnPrimary: =false
                  OnSecondary: =false
                  PrimaryIcon: =""
                  PrimaryLabel: =""
                  SecondaryIcon: =""
                  SecondaryLabel: =""
                  ShowBack: =true
                  Subtitle: ="Record the intake exactly as received"
                  Title: ="New FOIA request"
            - cntNewRequestBody:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                Children:
                  - cmpNewRequestNavRail:
                      Control: CanvasComponent
                      ComponentName: cmpSideNav
                      Properties:
                        ActiveScreen: ="NewRequest"
                        AlignInContainer: =AlignInContainer.Stretch
                        Height: =Parent.Height
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        Placement: ="Rail"
                        Visible: =App.Width >= BreakpointPhone
                        Width: =If(App.Width >= BreakpointDesktop, NavRailWidthDesktop, NavRailWidthTablet)
                  - cntNewRequestContentOuter:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                      Children:
                        - cntNewRequestContent:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              AlignInContainer: =AlignInContainer.Center
                              DropShadow: =DropShadow.None
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =SpaceMd
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              LayoutOverflowY: =LayoutOverflow.Scroll
                              PaddingBottom: =If(App.Width < BreakpointPhone, PagePaddingPhone, PagePaddingWide)
                              PaddingLeft: =If(App.Width < BreakpointPhone, PagePaddingPhone, PagePaddingWide)
                              PaddingRight: =If(App.Width < BreakpointPhone, PagePaddingPhone, PagePaddingWide)
                              PaddingTop: =If(App.Width < BreakpointPhone, PagePaddingPhone, PagePaddingWide)
                              RadiusBottomLeft: =0
                              RadiusBottomRight: =0
                              RadiusTopLeft: =0
                              RadiusTopRight: =0
                              Width: =Min(Parent.Width, ContentMaxWidth)
                            Children:
                              - cntNewRequestColumns:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    FillPortions: =0
                                    Height: =If(App.Width >= BreakpointDesktop, Max(cntNewRequestForm.Height, cntIntakeGuidance.Height), cntNewRequestForm.Height)
                                    LayoutDirection: =If(App.Width >= BreakpointDesktop, LayoutDirection.Horizontal, LayoutDirection.Vertical)
                                    LayoutGap: =SpaceLg
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    RadiusBottomLeft: =0
                                    RadiusBottomRight: =0
                                    RadiusTopLeft: =0
                                    RadiusTopRight: =0
                                  Children:
                                    - cntNewRequestForm:
                                        Control: GroupContainer
                                        Variant: AutoLayout
                                        Properties:
                                          AlignInContainer: =AlignInContainer.Start
                                          DropShadow: =DropShadow.None
                                          FillPortions: =If(App.Width >= BreakpointDesktop, 1, 0)
                                          Height: =cntCardRequester.Height + SpaceMd + cntCardRequest.Height + SpaceMd + cntCardDates.Height + If(lblRequestValidation.Visible, SpaceMd + lblRequestValidation.Height, 0) + If(lblRequestError.Visible, SpaceMd + lblRequestError.Height, 0) + If(lblRequestPermission.Visible, SpaceMd + lblRequestPermission.Height, 0) + If(lblRequestSuccess.Visible, SpaceMd + lblRequestSuccess.Height, 0)
                                          LayoutAlignItems: =LayoutAlignItems.Stretch
                                          LayoutDirection: =LayoutDirection.Vertical
                                          LayoutGap: =SpaceMd
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                          RadiusBottomLeft: =0
                                          RadiusBottomRight: =0
                                          RadiusTopLeft: =0
                                          RadiusTopRight: =0
                                          Width: =Parent.Width
                                        Children:
                                          - cntCardRequester:
                                              Control: GroupContainer
                                              Variant: AutoLayout
                                              Properties:
                                                BorderColor: =ColorNeutralStroke
                                                BorderThickness: =1
                                                DropShadow: =DropShadow.None
                                                Fill: =ColorSurface
                                                FillPortions: =0
                                                Height: =SpaceMd * 2 + lblRequesterSection.Height + SpaceSm + cntRequesterFields.Height
                                                LayoutAlignItems: =LayoutAlignItems.Stretch
                                                LayoutDirection: =LayoutDirection.Vertical
                                                LayoutGap: =SpaceSm
                                                LayoutMinHeight: =0
                                                LayoutMinWidth: =0
                                                PaddingBottom: =SpaceMd
                                                PaddingLeft: =SpaceMd
                                                PaddingRight: =SpaceMd
                                                PaddingTop: =SpaceMd
                                                RadiusBottomLeft: =RadiusSm
                                                RadiusBottomRight: =RadiusSm
                                                RadiusTopLeft: =RadiusSm
                                                RadiusTopRight: =RadiusSm
                                              Children:
                                                - lblRequesterSection:
                                                    Control: ModernText
                                                    Properties:
                                                      AccessibleLabel: =Self.Text
                                                      AlignInContainer: =AlignInContainer.Stretch
                                                      AutoHeight: =true
                                                      Color: =ColorTextPrimary
                                                      FontWeight: =FontWeight.Semibold
                                                      LayoutMinHeight: =0
                                                      LayoutMinWidth: =0
                                                      PaddingBottom: =0
                                                      PaddingLeft: =0
                                                      PaddingRight: =0
                                                      PaddingTop: =0
                                                      Size: =FontSizeSection
                                                      Text: ="Requester information"
                                                      Wrap: =false
                                                - cntRequesterFields:
                                                    Control: GroupContainer
                                                    Variant: AutoLayout
                                                    Properties:
                                                      DropShadow: =DropShadow.None
                                                      FillPortions: =0
                                                      Height: =If(App.Width < BreakpointPhone, FieldHeight * 4 + SpaceMd * 3, FieldHeight * 2 + SpaceMd)
                                                      LayoutDirection: =LayoutDirection.Horizontal
                                                      LayoutGap: =SpaceMd
                                                      LayoutMinHeight: =0
                                                      LayoutMinWidth: =0
                                                      LayoutWrap: =true
                                                      RadiusBottomLeft: =0
                                                      RadiusBottomRight: =0
                                                      RadiusTopLeft: =0
                                                      RadiusTopRight: =0
                                                    Children:
                                                      - cntRequesterFirstName:
                                                          Control: GroupContainer
                                                          Variant: AutoLayout
                                                          Properties:
                                                            AlignInContainer: =AlignInContainer.Start
                                                            DropShadow: =DropShadow.None
                                                            FillPortions: =0
                                                            Height: =FieldHeight
                                                            LayoutAlignItems: =LayoutAlignItems.Stretch
                                                            LayoutDirection: =LayoutDirection.Vertical
                                                            LayoutGap: =6
                                                            LayoutMinHeight: =FieldHeight
                                                            LayoutMinWidth: =200
                                                            RadiusBottomLeft: =0
                                                            RadiusBottomRight: =0
                                                            RadiusTopLeft: =0
                                                            RadiusTopRight: =0
                                                            Width: =If(App.Width < BreakpointPhone, Parent.Width, App.Width < BreakpointDesktop, (Parent.Width - SpaceMd) / 2 - 1, (Parent.Width - SpaceMd * 2) / 3 - 1)
                                                          Children:
                                                            - lblRequesterFirstName:
                                                                Control: ModernText
                                                                Properties:
                                                                  AccessibleLabel: =Self.Text
                                                                  AlignInContainer: =AlignInContainer.Stretch
                                                                  AutoHeight: =true
                                                                  Color: =ColorTextSecondary
                                                                  LayoutMinHeight: =0
                                                                  LayoutMinWidth: =0
                                                                  PaddingBottom: =0
                                                                  PaddingLeft: =0
                                                                  PaddingRight: =0
                                                                  PaddingTop: =0
                                                                  Size: =FontSizeCaption
                                                                  Text: ="First name *"
                                                                  Wrap: =false
                                                            - txtRequesterFirstName:
                                                                Control: ModernTextInput
                                                                Properties:
                                                                  AccessibleLabel: ="Requester first name"
                                                                  AlignInContainer: =AlignInContainer.Stretch
                                                                  Height: =InputHeight
                                                                  LayoutMinHeight: =InputHeight
                                                                  LayoutMinWidth: =0
                                                                  MaxLength: =100
                                                                  Placeholder: ="First name"
                                                                  Required: =true
                                                                  Size: =If(App.Width < BreakpointPhone, FontSizeBodyPhone, FontSizeBody)
                                                      - cntRequesterLastName:
                                                          Control: GroupContainer
                                                          Variant: AutoLayout
                                                          Properties:
                                                            AlignInContainer: =AlignInContainer.Start
                                                            DropShadow: =DropShadow.None
                                                            FillPortions: =0
                                                            Height: =FieldHeight
                                                            LayoutAlignItems: =LayoutAlignItems.Stretch
                                                            LayoutDirection: =LayoutDirection.Vertical
                                                            LayoutGap: =6
                                                            LayoutMinHeight: =FieldHeight
                                                            LayoutMinWidth: =200
                                                            RadiusBottomLeft: =0
                                                            RadiusBottomRight: =0
                                                            RadiusTopLeft: =0
                                                            RadiusTopRight: =0
                                                            Width: =If(App.Width < BreakpointPhone, Parent.Width, App.Width < BreakpointDesktop, (Parent.Width - SpaceMd) / 2 - 1, (Parent.Width - SpaceMd * 2) / 3 - 1)
                                                          Children:
                                                            - lblRequesterLastName:
                                                                Control: ModernText
                                                                Properties:
                                                                  AccessibleLabel: =Self.Text
                                                                  AlignInContainer: =AlignInContainer.Stretch
                                                                  AutoHeight: =true
                                                                  Color: =ColorTextSecondary
                                                                  LayoutMinHeight: =0
                                                                  LayoutMinWidth: =0
                                                                  PaddingBottom: =0
                                                                  PaddingLeft: =0
                                                                  PaddingRight: =0
                                                                  PaddingTop: =0
                                                                  Size: =FontSizeCaption
                                                                  Text: ="Last name *"
                                                                  Wrap: =false
                                                            - txtRequesterLastName:
                                                                Control: ModernTextInput
                                                                Properties:
                                                                  AccessibleLabel: ="Requester last name"
                                                                  AlignInContainer: =AlignInContainer.Stretch
                                                                  Height: =InputHeight
                                                                  LayoutMinHeight: =InputHeight
                                                                  LayoutMinWidth: =0
                                                                  MaxLength: =100
                                                                  Placeholder: ="Last name"
                                                                  Required: =true
                                                                  Size: =If(App.Width < BreakpointPhone, FontSizeBodyPhone, FontSizeBody)
                                                      - cntRequesterEmail:
                                                          Control: GroupContainer
                                                          Variant: AutoLayout
                                                          Properties:
                                                            AlignInContainer: =AlignInContainer.Start
                                                            DropShadow: =DropShadow.None
                                                            FillPortions: =0
                                                            Height: =FieldHeight
                                                            LayoutAlignItems: =LayoutAlignItems.Stretch
                                                            LayoutDirection: =LayoutDirection.Vertical
                                                            LayoutGap: =6
                                                            LayoutMinHeight: =FieldHeight
                                                            LayoutMinWidth: =200
                                                            RadiusBottomLeft: =0
                                                            RadiusBottomRight: =0
                                                            RadiusTopLeft: =0
                                                            RadiusTopRight: =0
                                                            Width: =If(App.Width < BreakpointPhone, Parent.Width, App.Width < BreakpointDesktop, (Parent.Width - SpaceMd) / 2 - 1, (Parent.Width - SpaceMd * 2) / 3 - 1)
                                                          Children:
                                                            - lblRequesterEmail:
                                                                Control: ModernText
                                                                Properties:
                                                                  AccessibleLabel: =Self.Text
                                                                  AlignInContainer: =AlignInContainer.Stretch
                                                                  AutoHeight: =true
                                                                  Color: =ColorTextSecondary
                                                                  LayoutMinHeight: =0
                                                                  LayoutMinWidth: =0
                                                                  PaddingBottom: =0
                                                                  PaddingLeft: =0
                                                                  PaddingRight: =0
                                                                  PaddingTop: =0
                                                                  Size: =FontSizeCaption
                                                                  Text: ="Email"
                                                                  Wrap: =false
                                                            - txtRequesterEmail:
                                                                Control: ModernTextInput
                                                                Properties:
                                                                  AccessibleLabel: ="Requester email"
                                                                  AlignInContainer: =AlignInContainer.Stretch
                                                                  Height: =InputHeight
                                                                  LayoutMinHeight: =InputHeight
                                                                  LayoutMinWidth: =0
                                                                  MaxLength: =255
                                                                  Placeholder: ="name@example.com"
                                                                  Size: =If(App.Width < BreakpointPhone, FontSizeBodyPhone, FontSizeBody)
                                                      - cntRequesterPhone:
                                                          Control: GroupContainer
                                                          Variant: AutoLayout
                                                          Properties:
                                                            AlignInContainer: =AlignInContainer.Start
                                                            DropShadow: =DropShadow.None
                                                            FillPortions: =0
                                                            Height: =FieldHeight
                                                            LayoutAlignItems: =LayoutAlignItems.Stretch
                                                            LayoutDirection: =LayoutDirection.Vertical
                                                            LayoutGap: =6
                                                            LayoutMinHeight: =FieldHeight
                                                            LayoutMinWidth: =200
                                                            RadiusBottomLeft: =0
                                                            RadiusBottomRight: =0
                                                            RadiusTopLeft: =0
                                                            RadiusTopRight: =0
                                                            Width: =If(App.Width < BreakpointPhone, Parent.Width, App.Width < BreakpointDesktop, (Parent.Width - SpaceMd) / 2 - 1, (Parent.Width - SpaceMd * 2) / 3 - 1)
                                                          Children:
                                                            - lblRequesterPhone:
                                                                Control: ModernText
                                                                Properties:
                                                                  AccessibleLabel: =Self.Text
                                                                  AlignInContainer: =AlignInContainer.Stretch
                                                                  AutoHeight: =true
                                                                  Color: =ColorTextSecondary
                                                                  LayoutMinHeight: =0
                                                                  LayoutMinWidth: =0
                                                                  PaddingBottom: =0
                                                                  PaddingLeft: =0
                                                                  PaddingRight: =0
                                                                  PaddingTop: =0
                                                                  Size: =FontSizeCaption
                                                                  Text: ="Phone"
                                                                  Wrap: =false
                                                            - txtRequesterPhone:
                                                                Control: ModernTextInput
                                                                Properties:
                                                                  AccessibleLabel: ="Requester phone"
                                                                  AlignInContainer: =AlignInContainer.Stretch
                                                                  Height: =InputHeight
                                                                  LayoutMinHeight: =InputHeight
                                                                  LayoutMinWidth: =0
                                                                  MaxLength: =30
                                                                  Placeholder: ="(708) 555-0100"
                                                                  Size: =If(App.Width < BreakpointPhone, FontSizeBodyPhone, FontSizeBody)
                                          - cntCardRequest:
                                              Control: GroupContainer
                                              Variant: AutoLayout
                                              Properties:
                                                BorderColor: =ColorNeutralStroke
                                                BorderThickness: =1
                                                DropShadow: =DropShadow.None
                                                Fill: =ColorSurface
                                                FillPortions: =0
                                                Height: =SpaceMd * 2 + lblRequestSection.Height + SpaceSm + cntRequestDescriptionField.Height + SpaceSm + cntRequestChoiceFields.Height
                                                LayoutAlignItems: =LayoutAlignItems.Stretch
                                                LayoutDirection: =LayoutDirection.Vertical
                                                LayoutGap: =SpaceSm
                                                LayoutMinHeight: =0
                                                LayoutMinWidth: =0
                                                PaddingBottom: =SpaceMd
                                                PaddingLeft: =SpaceMd
                                                PaddingRight: =SpaceMd
                                                PaddingTop: =SpaceMd
                                                RadiusBottomLeft: =RadiusSm
                                                RadiusBottomRight: =RadiusSm
                                                RadiusTopLeft: =RadiusSm
                                                RadiusTopRight: =RadiusSm
                                              Children:
                                                - lblRequestSection:
                                                    Control: ModernText
                                                    Properties:
                                                      AccessibleLabel: =Self.Text
                                                      AlignInContainer: =AlignInContainer.Stretch
                                                      AutoHeight: =true
                                                      Color: =ColorTextPrimary
                                                      FontWeight: =FontWeight.Semibold
                                                      LayoutMinHeight: =0
                                                      LayoutMinWidth: =0
                                                      PaddingBottom: =0
                                                      PaddingLeft: =0
                                                      PaddingRight: =0
                                                      PaddingTop: =0
                                                      Size: =FontSizeSection
                                                      Text: ="Request details"
                                                      Wrap: =false
                                                - cntRequestDescriptionField:
                                                    Control: GroupContainer
                                                    Variant: AutoLayout
                                                    Properties:
                                                      DropShadow: =DropShadow.None
                                                      FillPortions: =0
                                                      Height: =FieldHeight - InputHeight + 112
                                                      LayoutAlignItems: =LayoutAlignItems.Stretch
                                                      LayoutDirection: =LayoutDirection.Vertical
                                                      LayoutGap: =6
                                                      LayoutMinHeight: =FieldHeight - InputHeight + 112
                                                      LayoutMinWidth: =0
                                                      RadiusBottomLeft: =0
                                                      RadiusBottomRight: =0
                                                      RadiusTopLeft: =0
                                                      RadiusTopRight: =0
                                                    Children:
                                                      - lblRequestDescription:
                                                          Control: ModernText
                                                          Properties:
                                                            AccessibleLabel: =Self.Text
                                                            AlignInContainer: =AlignInContainer.Stretch
                                                            AutoHeight: =true
                                                            Color: =ColorTextSecondary
                                                            LayoutMinHeight: =0
                                                            LayoutMinWidth: =0
                                                            PaddingBottom: =0
                                                            PaddingLeft: =0
                                                            PaddingRight: =0
                                                            PaddingTop: =0
                                                            Size: =FontSizeCaption
                                                            Text: ="What records are being requested? *"
                                                            Wrap: =false
                                                      - txtRequestDescription:
                                                          Control: ModernTextInput
                                                          Properties:
                                                            AccessibleLabel: ="Request description"
                                                            AlignInContainer: =AlignInContainer.Stretch
                                                            Height: =112
                                                            LayoutMinHeight: =112
                                                            LayoutMinWidth: =0
                                                            MaxLength: =4000
                                                            Placeholder: ="Describe the records requested, including date ranges and locations where known"
                                                            Required: =true
                                                            Size: =If(App.Width < BreakpointPhone, FontSizeBodyPhone, FontSizeBody)
                                                            Type: =TextInputType.Multiline
                                                - cntRequestChoiceFields:
                                                    Control: GroupContainer
                                                    Variant: AutoLayout
                                                    Properties:
                                                      DropShadow: =DropShadow.None
                                                      FillPortions: =0
                                                      Height: =If(App.Width < BreakpointPhone, FieldHeight * 4 + SpaceMd * 3, FieldHeight * 2 + SpaceMd)
                                                      LayoutDirection: =LayoutDirection.Horizontal
                                                      LayoutGap: =SpaceMd
                                                      LayoutMinHeight: =0
                                                      LayoutMinWidth: =0
                                                      LayoutWrap: =true
                                                      RadiusBottomLeft: =0
                                                      RadiusBottomRight: =0
                                                      RadiusTopLeft: =0
                                                      RadiusTopRight: =0
                                                    Children:
                                                      - cntPrimaryDepartment:
                                                          Control: GroupContainer
                                                          Variant: AutoLayout
                                                          Properties:
                                                            AlignInContainer: =AlignInContainer.Start
                                                            DropShadow: =DropShadow.None
                                                            FillPortions: =0
                                                            Height: =FieldHeight
                                                            LayoutAlignItems: =LayoutAlignItems.Stretch
                                                            LayoutDirection: =LayoutDirection.Vertical
                                                            LayoutGap: =6
                                                            LayoutMinHeight: =FieldHeight
                                                            LayoutMinWidth: =200
                                                            RadiusBottomLeft: =0
                                                            RadiusBottomRight: =0
                                                            RadiusTopLeft: =0
                                                            RadiusTopRight: =0
                                                            Width: =If(App.Width < BreakpointPhone, Parent.Width, App.Width < BreakpointDesktop, (Parent.Width - SpaceMd) / 2 - 1, (Parent.Width - SpaceMd * 2) / 3 - 1)
                                                          Children:
                                                            - lblPrimaryDepartment:
                                                                Control: ModernText
                                                                Properties:
                                                                  AccessibleLabel: =Self.Text
                                                                  AlignInContainer: =AlignInContainer.Stretch
                                                                  AutoHeight: =true
                                                                  Color: =ColorTextSecondary
                                                                  LayoutMinHeight: =0
                                                                  LayoutMinWidth: =0
                                                                  PaddingBottom: =0
                                                                  PaddingLeft: =0
                                                                  PaddingRight: =0
                                                                  PaddingTop: =0
                                                                  Size: =FontSizeCaption
                                                                  Text: ="Primary department *"
                                                                  Wrap: =false
                                                            - cmbPrimaryDepartment:
                                                                Control: ModernCombobox
                                                                Properties:
                                                                  AccessibleLabel: ="Primary department"
                                                                  AlignInContainer: =AlignInContainer.Stretch
                                                                  Height: =InputHeight
                                                                  InputTextPlaceholder: ="Select a department"
                                                                  ItemDisplayText: =ThisItem.Title
                                                                  Items: =SortByColumns(Filter('FOIA Pilot Departments', Active = true), "SortOrder", SortOrder.Ascending)
                                                                  LayoutMinHeight: =InputHeight
                                                                  LayoutMinWidth: =0
                                                                  SelectMultiple: =false
                                                                  Size: =If(App.Width < BreakpointPhone, FontSizeBodyPhone, FontSizeBody)
                                                      - cntIntakeMethod:
                                                          Control: GroupContainer
                                                          Variant: AutoLayout
                                                          Properties:
                                                            AlignInContainer: =AlignInContainer.Start
                                                            DropShadow: =DropShadow.None
                                                            FillPortions: =0
                                                            Height: =FieldHeight
                                                            LayoutAlignItems: =LayoutAlignItems.Stretch
                                                            LayoutDirection: =LayoutDirection.Vertical
                                                            LayoutGap: =6
                                                            LayoutMinHeight: =FieldHeight
                                                            LayoutMinWidth: =200
                                                            RadiusBottomLeft: =0
                                                            RadiusBottomRight: =0
                                                            RadiusTopLeft: =0
                                                            RadiusTopRight: =0
                                                            Width: =If(App.Width < BreakpointPhone, Parent.Width, App.Width < BreakpointDesktop, (Parent.Width - SpaceMd) / 2 - 1, (Parent.Width - SpaceMd * 2) / 3 - 1)
                                                          Children:
                                                            - lblIntakeMethod:
                                                                Control: ModernText
                                                                Properties:
                                                                  AccessibleLabel: =Self.Text
                                                                  AlignInContainer: =AlignInContainer.Stretch
                                                                  AutoHeight: =true
                                                                  Color: =ColorTextSecondary
                                                                  LayoutMinHeight: =0
                                                                  LayoutMinWidth: =0
                                                                  PaddingBottom: =0
                                                                  PaddingLeft: =0
                                                                  PaddingRight: =0
                                                                  PaddingTop: =0
                                                                  Size: =FontSizeCaption
                                                                  Text: ="Intake method *"
                                                                  Wrap: =false
                                                            - cmbIntakeMethod:
                                                                Control: ModernCombobox
                                                                Properties:
                                                                  AccessibleLabel: ="Intake method"
                                                                  AlignInContainer: =AlignInContainer.Stretch
                                                                  DefaultSelectedItems: =LookUp(Choices('FOIA Pilot Requests'.IntakeMethod), Value = "Online Form")
                                                                  Height: =InputHeight
                                                                  InputTextPlaceholder: ="Select an intake method"
                                                                  IsSearchable: =false
                                                                  ItemDisplayText: =ThisItem.Value
                                                                  Items: =Choices('FOIA Pilot Requests'.IntakeMethod)
                                                                  LayoutMinHeight: =InputHeight
                                                                  LayoutMinWidth: =0
                                                                  SelectMultiple: =false
                                                                  Size: =If(App.Width < BreakpointPhone, FontSizeBodyPhone, FontSizeBody)
                                                      - cntRequestRoute:
                                                          Control: GroupContainer
                                                          Variant: AutoLayout
                                                          Properties:
                                                            AlignInContainer: =AlignInContainer.Start
                                                            DropShadow: =DropShadow.None
                                                            FillPortions: =0
                                                            Height: =FieldHeight
                                                            LayoutAlignItems: =LayoutAlignItems.Stretch
                                                            LayoutDirection: =LayoutDirection.Vertical
                                                            LayoutGap: =6
                                                            LayoutMinHeight: =FieldHeight
                                                            LayoutMinWidth: =200
                                                            RadiusBottomLeft: =0
                                                            RadiusBottomRight: =0
                                                            RadiusTopLeft: =0
                                                            RadiusTopRight: =0
                                                            Width: =If(App.Width < BreakpointPhone, Parent.Width, App.Width < BreakpointDesktop, (Parent.Width - SpaceMd) / 2 - 1, (Parent.Width - SpaceMd * 2) / 3 - 1)
                                                          Children:
                                                            - lblRequestRoute:
                                                                Control: ModernText
                                                                Properties:
                                                                  AccessibleLabel: =Self.Text
                                                                  AlignInContainer: =AlignInContainer.Stretch
                                                                  AutoHeight: =true
                                                                  Color: =ColorTextSecondary
                                                                  LayoutMinHeight: =0
                                                                  LayoutMinWidth: =0
                                                                  PaddingBottom: =0
                                                                  PaddingLeft: =0
                                                                  PaddingRight: =0
                                                                  PaddingTop: =0
                                                                  Size: =FontSizeCaption
                                                                  Text: ="Request route *"
                                                                  Wrap: =false
                                                            - cmbRequestRoute:
                                                                Control: ModernCombobox
                                                                Properties:
                                                                  AccessibleLabel: ="Request route"
                                                                  AlignInContainer: =AlignInContainer.Stretch
                                                                  Height: =InputHeight
                                                                  InputTextPlaceholder: ="Select a route"
                                                                  IsSearchable: =false
                                                                  ItemDisplayText: =ThisItem.Value
                                                                  Items: =Choices('FOIA Pilot Requests'.RequestRoute)
                                                                  LayoutMinHeight: =InputHeight
                                                                  LayoutMinWidth: =0
                                                                  SelectMultiple: =false
                                                                  Size: =If(App.Width < BreakpointPhone, FontSizeBodyPhone, FontSizeBody)
                                                      - cntDeliveryFormat:
                                                          Control: GroupContainer
                                                          Variant: AutoLayout
                                                          Properties:
                                                            AlignInContainer: =AlignInContainer.Start
                                                            DropShadow: =DropShadow.None
                                                            FillPortions: =0
                                                            Height: =FieldHeight
                                                            LayoutAlignItems: =LayoutAlignItems.Stretch
                                                            LayoutDirection: =LayoutDirection.Vertical
                                                            LayoutGap: =6
                                                            LayoutMinHeight: =FieldHeight
                                                            LayoutMinWidth: =200
                                                            RadiusBottomLeft: =0
                                                            RadiusBottomRight: =0
                                                            RadiusTopLeft: =0
                                                            RadiusTopRight: =0
                                                            Width: =If(App.Width < BreakpointPhone, Parent.Width, App.Width < BreakpointDesktop, (Parent.Width - SpaceMd) / 2 - 1, (Parent.Width - SpaceMd * 2) / 3 - 1)
                                                          Children:
