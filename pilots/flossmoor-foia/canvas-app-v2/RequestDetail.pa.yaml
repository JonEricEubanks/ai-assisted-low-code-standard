Screens:
  RequestDetail:
    Properties:
      Fill: =ColorNeutralBg
      LoadingSpinnerColor: =ColorBrand
      OnVisible: |-
        =Set(gblIsLoading, false);
        Set(gblLoadError, false);
        Set(gblPermissionDenied, false);
        Set(gblSaveSuccess, false);
        Set(gblExtensionValidationMessage, "")
    Children:
      - cntRequestDetailShell:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =ColorNeutralBg
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Vertical
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =Parent.Width
          Children:
            - cmpRequestDetailHeader:
                Control: CanvasComponent
                ComponentName: cmpAppHeader
                Properties:
                  AlignInContainer: =AlignInContainer.Stretch
                  Height: =HeaderHeight
                  LayoutMinHeight: =HeaderHeight
                  LayoutMinWidth: =0
                  OnBack: =Navigate(Home, ScreenTransition.None)
                  OnPrimary: =Navigate(ResponseCloseout, ScreenTransition.None)
                  OnSecondary: =false
                  PrimaryIcon: ="CheckmarkCircle"
                  PrimaryLabel: ="Closeout"
                  SecondaryIcon: =""
                  SecondaryLabel: =""
                  ShowBack: =true
                  Subtitle: =If(IsBlank(gblSelectedRequest), "", "Received " & Text(gblSelectedRequest.ReceivedDate, "mmm d, yyyy"))
                  Title: =Coalesce(gblSelectedRequest.Title, "Request detail")
            - cntRequestDetailBody:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =ColorNeutralBg
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                Children:
                  - cmpRequestDetailNavRail:
                      Control: CanvasComponent
                      ComponentName: cmpSideNav
                      Properties:
                        ActiveScreen: ="Home"
                        AlignInContainer: =AlignInContainer.Stretch
                        Height: =Parent.Height
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        Placement: ="Rail"
                        Visible: =App.Width >= BreakpointPhone
                        Width: =If(App.Width >= BreakpointDesktop, NavRailWidthDesktop, NavRailWidthTablet)
                  - cntRequestDetailContentOuter:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =ColorNeutralBg
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                      Children:
                        - cntRequestDetailContent:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              AlignInContainer: =AlignInContainer.Center
                              DropShadow: =DropShadow.None
                              Fill: =ColorNeutralBg
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =SpaceMd
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              PaddingBottom: =If(App.Width < BreakpointPhone, PagePaddingPhone, PagePaddingWide)
                              PaddingLeft: =If(App.Width < BreakpointPhone, PagePaddingPhone, PagePaddingWide)
                              PaddingRight: =If(App.Width < BreakpointPhone, PagePaddingPhone, PagePaddingWide)
                              PaddingTop: =If(App.Width < BreakpointPhone, PagePaddingPhone, PagePaddingWide)
                              RadiusBottomLeft: =0
                              RadiusBottomRight: =0
                              RadiusTopLeft: =0
                              RadiusTopRight: =0
                              Width: =Min(Parent.Width, ContentMaxWidth)
                            Children:
                              - cntRequestDetailEmpty:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    BorderColor: =ColorNeutralStroke
                                    BorderThickness: =1
                                    DropShadow: =DropShadow.None
                                    Fill: =ColorSurface
                                    LayoutAlignItems: =LayoutAlignItems.Center
                                    LayoutDirection: =LayoutDirection.Vertical
                                    LayoutGap: =SpaceSm
                                    LayoutJustifyContent: =LayoutJustifyContent.Center
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    PaddingBottom: =SpaceLg
                                    PaddingLeft: =SpaceLg
                                    PaddingRight: =SpaceLg
                                    PaddingTop: =SpaceLg
                                    RadiusBottomLeft: =RadiusSm
                                    RadiusBottomRight: =RadiusSm
                                    RadiusTopLeft: =RadiusSm
                                    RadiusTopRight: =RadiusSm
                                    Visible: =IsBlank(gblSelectedRequest)
                                  Children:
                                    - icoRequestDetailEmpty:
                                        Control: ModernIcon
                                        Properties:
                                          AccessibleLabel: ="No request selected"
                                          AlignInContainer: =AlignInContainer.Center
                                          Height: =48
                                          Icon: ="DocumentSearch"
                                          IconColor: =ColorTextSecondary
                                          LayoutMinHeight: =48
                                          LayoutMinWidth: =48
                                          Width: =48
                                    - lblRequestDetailEmptyTitle:
                                        Control: ModernText
                                        Properties:
                                          AccessibleLabel: =Self.Text
                                          Align: =Align.Center
                                          AlignInContainer: =AlignInContainer.Stretch
                                          AutoHeight: =true
                                          Color: =ColorTextPrimary
                                          FontWeight: =FontWeight.Semibold
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingRight: =0
                                          PaddingTop: =0
                                          Size: =FontSizeSection
                                          Text: ="Select a request"
                                          Wrap: =false
                                    - lblRequestDetailEmptyHint:
                                        Control: ModernText
                                        Properties:
                                          AccessibleLabel: =Self.Text
                                          Align: =Align.Center
                                          AlignInContainer: =AlignInContainer.Center
                                          AutoHeight: =true
                                          Color: =ColorTextSecondary
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingRight: =0
                                          PaddingTop: =0
                                          Size: =FontSizeCaption
                                          Text: ="Summary, department assignments, and a dated activity timeline will appear here."
                                          Visible: =App.Width >= BreakpointPhone
                                          Width: =320
                                    - btnRequestDetailEmptyHome:
                                        Control: ModernButton
                                        Properties:
                                          AccessibleLabel: ="Go to Home"
                                          AlignInContainer: =AlignInContainer.Center
                                          BasePaletteColor: =ColorBrand
                                          Height: =ControlMinTouch
                                          Icon: ="Home"
                                          LayoutMinHeight: =ControlMinTouch
                                          LayoutMinWidth: =0
                                          OnSelect: =Navigate(Home, ScreenTransition.None)
                                          Size: =FontSizeBody
                                          Text: ="Go to Home"
                                          Tooltip: =Self.Text
                                          Width: =Len(Self.Text) * 9 + SpaceLg * 2 + 24
                              - cmpRequestDetailPaneHost:
                                  Control: CanvasComponent
                                  ComponentName: cmpRequestDetailPane
                                  Properties:
                                    AlignInContainer: =AlignInContainer.Stretch
                                    FillPortions: =1
                                    Height: =Parent.Height
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    OnConfirmDueDate: |-
                                      =IfError(
                                        Patch('FOIA Pilot Requests', gblSelectedRequest, {DueDateConfirmed: true});
                                        Set(gblSelectedRequest, LookUp('FOIA Pilot Requests', ID = gblSelectedRequest.ID));
                                        Notify("Due date confirmed.", NotificationType.Success),
                                        Notify("The due date could not be confirmed: " & FirstError.Message, NotificationType.Error)
                                      )
                                    OnOpenCloseout: =Navigate(ResponseCloseout, ScreenTransition.None)
                                    OnOpenDepartmentWork: |-
                                      =If(IsBlank(gblSelectedAssignment) || gblSelectedAssignment.Request.Id <> gblSelectedRequest.ID,
                                        Set(gblSelectedAssignment, First(Filter('FOIA Pilot Assignments', Request.Id = gblSelectedRequest.ID && Active = true))));
                                      Set(gblSelectedDepartment, gblSelectedAssignment.Department);
                                      Navigate(DepartmentWork, ScreenTransition.None)
                                    ShowQuickActions: =true
                                    Visible: =!IsBlank(gblSelectedRequest)
                                    Width: =Parent.Width
            - cmpRequestDetailNavBottom:
                Control: CanvasComponent
                ComponentName: cmpSideNav
                Properties:
                  ActiveScreen: ="Home"
                  AlignInContainer: =AlignInContainer.Stretch
                  Height: =BottomNavHeight
                  LayoutMinHeight: =BottomNavHeight
                  LayoutMinWidth: =0
                  Placement: ="Bottom"
                  Visible: =App.Width < BreakpointPhone
                  Width: =App.Width
