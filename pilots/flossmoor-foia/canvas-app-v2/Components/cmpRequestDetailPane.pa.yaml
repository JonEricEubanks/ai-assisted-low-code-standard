ComponentDefinitions:
  cmpRequestDetailPane:
    DefinitionType: CanvasComponent
    Description: Single request detail surface (summary / assignments / activity). Reads gblSelectedRequest through app scope; performs no writes - quick actions raise events for the host screen.
    AccessAppScope: true
    CustomProperties:
      OnConfirmDueDate:
        PropertyKind: Event
        DisplayName: OnConfirmDueDate
        Description: Raised when "Confirm due date" is selected. Host patches DueDateConfirmed inside IfError.
        ReturnType: None
        Default: =false
      OnOpenCloseout:
        PropertyKind: Event
        DisplayName: OnOpenCloseout
        Description: Raised when "Closeout" is selected. Host navigates to ResponseCloseout.
        ReturnType: None
        Default: =false
      OnOpenDepartmentWork:
        PropertyKind: Event
        DisplayName: OnOpenDepartmentWork
        Description: Raised when "Open department work" or an assignment row's open button is selected. gblSelectedAssignment / gblSelectedDepartment are already set by the pane when raised from a row.
        ReturnType: None
        Default: =false
      ShowQuickActions:
        PropertyKind: Input
        DisplayName: ShowQuickActions
        Description: Shows the quick-action strip (confirm due date, open department work, closeout).
        DataType: Boolean
        Default: =true
    Properties:
      Fill: =ColorSurface
      Height: =600
      Width: =480
    Children:
      - cntPaneRoot:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            BorderColor: =ColorNeutralStroke
            BorderThickness: =1
            DropShadow: =DropShadow.None
            Fill: =ColorSurface
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Vertical
            LayoutGap: =SpaceMd
            LayoutOverflowY: =LayoutOverflow.Scroll
            PaddingBottom: =If(App.Width < BreakpointPhone, PagePaddingPhone, PagePaddingWide)
            PaddingLeft: =If(App.Width < BreakpointPhone, PagePaddingPhone, PagePaddingWide)
            PaddingRight: =If(App.Width < BreakpointPhone, PagePaddingPhone, PagePaddingWide)
            PaddingTop: =If(App.Width < BreakpointPhone, PagePaddingPhone, PagePaddingWide)
            RadiusBottomLeft: =RadiusSm
            RadiusBottomRight: =RadiusSm
            RadiusTopLeft: =RadiusSm
            RadiusTopRight: =RadiusSm
            Width: =Parent.Width
          Children:
            - cntPaneHead:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  FillPortions: =0
                  Height: =lblPaneTitle.Height + lblPaneMeta.Height + SpaceXs
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =SpaceMd
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  LayoutWrap: =true
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                Children:
                  - cntPaneTitles:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Height: =lblPaneTitle.Height + lblPaneMeta.Height + SpaceXs
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =SpaceXs
                        LayoutMinHeight: =0
                        LayoutMinWidth: =200
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                      Children:
                        - lblPaneTitle:
                            Control: ModernText
                            Properties:
                              AccessibleLabel: =Self.Text
                              AlignInContainer: =AlignInContainer.Stretch
                              AutoHeight: =true
                              Color: =ColorTextPrimary
                              FontWeight: =FontWeight.Semibold
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                              Size: =If(App.Width < BreakpointPhone, FontSizeTitlePhone, App.Width < BreakpointDesktop, FontSizeTitleTablet, FontSizeTitleDesktop)
                              Text: =Coalesce(gblSelectedRequest.Title, "No request selected")
                        - lblPaneMeta:
                            Control: ModernText
                            Properties:
                              AccessibleLabel: =Self.Text
                              AlignInContainer: =AlignInContainer.Stretch
                              AutoHeight: =true
                              Color: =ColorTextSecondary
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                              Size: =FontSizeCaption
                              Text: |-
                                =gblSelectedRequest.RequesterFirstName & " " & gblSelectedRequest.RequesterLastName &
                                " · Received " & If(IsBlank(gblSelectedRequest.ReceivedDate), "—", Text(gblSelectedRequest.ReceivedDate, "mmm d, yyyy")) &
                                " · " & Coalesce(gblSelectedRequest.PrimaryDepartment.Value, "No department")
                  - bdgPaneStatus:
                      Control: ModernBadge
                      Properties:
                        AccessibleLabel: |-
                          ="Status: " & Coalesce(gblSelectedRequest.OverallStatus.Value, "Not set")
                        AlignInContainer: =AlignInContainer.Start
                        Content: =Coalesce(gblSelectedRequest.OverallStatus.Value, "Not set")
                        FontWeight: =FontWeight.Semibold
                        Height: =24
                        Icon: |-
                          =Switch(gblSelectedRequest.OverallStatus.Value,
                            "New", "Info",
                            "In Progress", "ArrowClockwise",
                            "On Hold", "Pause",
                            "Ready", "Checkmark",
                            "Delivered", "Send",
                            "Closed", "CheckmarkCircle",
                            "Complete", "CheckmarkCircle",
                            "Overdue", "Warning",
                            "Circle")
                        Intent: |-
                          =Switch(gblSelectedRequest.OverallStatus.Value,
                            "New", BadgeIntent.Informative,
                            "In Progress", BadgeIntent.Highlight,
                            "On Hold", BadgeIntent.Caution,
                            "Ready", BadgeIntent.Attention,
                            "Delivered", BadgeIntent.Positive,
                            "Closed", BadgeIntent.Positive,
                            "Complete", BadgeIntent.Positive,
                            "Overdue", BadgeIntent.Critical,
                            BadgeIntent.Neutral)
                        LayoutMinHeight: =24
                        LayoutMinWidth: =120
                        Shape: =BadgeShape.Rounded
                        Size: =FontSizeCaption
                        Width: =120
            - cntPaneQuickActions:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  FillPortions: =0
                  Height: =If(App.Width < BreakpointPhone || Self.Width >= 640, ControlMinTouch, ControlMinTouch * 2 + SpaceSm)
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =SpaceSm
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  LayoutWrap: =true
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  Visible: =cmpRequestDetailPane.ShowQuickActions
                Children:
                  - btnPaneConfirmDue:
                      Control: ModernButton
                      Properties:
                        AccessibleLabel: ="Confirm the working due date"
                        AlignInContainer: =AlignInContainer.Center
                        Appearance: =ButtonAppearance.Secondary
                        Height: =ControlMinTouch
                        Icon: ="Checkmark"
                        Layout: =If(App.Width < BreakpointPhone, ButtonLayout.IconOnly, ButtonLayout.IconBefore)
                        LayoutMinHeight: =ControlMinTouch
                        LayoutMinWidth: =If(App.Width < BreakpointPhone, ControlMinTouch, Len(Self.Text) * 9 + SpaceLg * 2 + 24)
                        OnSelect: =cmpRequestDetailPane.OnConfirmDueDate()
                        Size: =FontSizeBody
                        Text: ="Confirm due date"
                        Tooltip: =Self.Text
                        Visible: =!IsBlank(gblSelectedRequest.DueDate) && !gblSelectedRequest.DueDateConfirmed
                        Width: =If(App.Width < BreakpointPhone, ControlMinTouch, Len(Self.Text) * 9 + SpaceLg * 2 + 24)
                  - btnPaneDeptWork:
                      Control: ModernButton
                      Properties:
                        AccessibleLabel: ="Open department work for this request"
                        AlignInContainer: =AlignInContainer.Center
                        Appearance: =ButtonAppearance.Secondary
                        DisplayMode: =If(CountRows(Filter('FOIA Pilot Assignments', Request.Id = gblSelectedRequest.ID && Active = true)) = 0, DisplayMode.Disabled, DisplayMode.Edit)
                        Height: =ControlMinTouch
                        Icon: ="People"
                        Layout: =If(App.Width < BreakpointPhone, ButtonLayout.IconOnly, ButtonLayout.IconBefore)
                        LayoutMinHeight: =ControlMinTouch
                        LayoutMinWidth: =If(App.Width < BreakpointPhone, ControlMinTouch, Len(Self.Text) * 9 + SpaceLg * 2 + 24)
                        OnSelect: =cmpRequestDetailPane.OnOpenDepartmentWork()
                        Size: =FontSizeBody
                        Text: ="Open department work"
                        Tooltip: =Self.Text
                        Width: =If(App.Width < BreakpointPhone, ControlMinTouch, Len(Self.Text) * 9 + SpaceLg * 2 + 24)
                  - btnPaneCloseout:
                      Control: ModernButton
                      Properties:
                        AccessibleLabel: ="Open response closeout for this request"
                        AlignInContainer: =AlignInContainer.Center
                        BasePaletteColor: =ColorBrand
                        Height: =ControlMinTouch
                        Icon: ="CheckmarkCircle"
                        Layout: =If(App.Width < BreakpointPhone, ButtonLayout.IconOnly, ButtonLayout.IconBefore)
                        LayoutMinHeight: =ControlMinTouch
                        LayoutMinWidth: =If(App.Width < BreakpointPhone, ControlMinTouch, Len(Self.Text) * 9 + SpaceLg * 2 + 24)
                        OnSelect: =cmpRequestDetailPane.OnOpenCloseout()
                        Size: =FontSizeBody
                        Text: ="Closeout"
                        Tooltip: =Self.Text
                        Width: =If(App.Width < BreakpointPhone, ControlMinTouch, Len(Self.Text) * 9 + SpaceLg * 2 + 24)
            - tabPaneDetail:
                Control: ModernTabList
                Properties:
                  AccessibleLabel: ="Request detail sections"
                  AlignInContainer: =AlignInContainer.Stretch
                  Appearance: =TabListAppearance.Subtle
                  Default: |-
                    ={Value: "Summary"}
                  Height: =ControlMinTouch
                  Items: =["Summary", "Assignments", "Activity"]
                  LayoutMinHeight: =ControlMinTouch
                  LayoutMinWidth: =0
                  Size: =FontSizeBody
                  TabSize: =TabSize.Medium
            - cntPaneTabSummary:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  FillPortions: =0
                  Height: =cntPaneFields.Height + cntPaneDescriptionBlock.Height + cntPaneStageNotesBlock.Height + cntPaneExtension.Height + SpaceMd * 3
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =SpaceMd
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  Visible: =tabPaneDetail.Selected.Value = "Summary"
                Children:
                  - cntPaneFields:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        FillPortions: =0
                        Height: =If(App.Width < BreakpointPhone, 11, 6) * FieldHeight + (If(App.Width < BreakpointPhone, 11, 6) - 1) * SpaceMd
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =SpaceMd
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        LayoutWrap: =true
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                      Children:
                        - cntPaneFieldRequester:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              AlignInContainer: =AlignInContainer.Start
                              DropShadow: =DropShadow.None
                              FillPortions: =0
                              Height: =FieldHeight
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =SpaceXs
                              LayoutMinHeight: =FieldHeight
                              LayoutMinWidth: =160
                              RadiusBottomLeft: =0
                              RadiusBottomRight: =0
                              RadiusTopLeft: =0
                              RadiusTopRight: =0
                              Width: =If(App.Width < BreakpointPhone, Parent.Width, (Parent.Width - SpaceMd) / 2 - 1)
                            Children:
                              - lblPaneFieldRequesterCaption:
                                  Control: ModernText
                                  Properties:
                                    AccessibleLabel: =Self.Text
                                    AlignInContainer: =AlignInContainer.Stretch
                                    AutoHeight: =true
                                    Color: =ColorTextSecondary
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    Size: =FontSizeCaption
                                    Text: ="Requester"
                              - lblPaneFieldRequesterValue:
                                  Control: ModernText
                                  Properties:
                                    AccessibleLabel: =Self.Text
                                    AlignInContainer: =AlignInContainer.Stretch
                                    AutoHeight: =true
                                    Color: =ColorTextPrimary
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    Size: =If(App.Width < BreakpointPhone, FontSizeBodyPhone, FontSizeBody)
                                    Text: =Coalesce(Trim(gblSelectedRequest.RequesterFirstName & " " & gblSelectedRequest.RequesterLastName), "—")
                        - cntPaneFieldEmail:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              AlignInContainer: =AlignInContainer.Start
                              DropShadow: =DropShadow.None
                              FillPortions: =0
                              Height: =FieldHeight
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =SpaceXs
                              LayoutMinHeight: =FieldHeight
                              LayoutMinWidth: =160
                              RadiusBottomLeft: =0
                              RadiusBottomRight: =0
                              RadiusTopLeft: =0
                              RadiusTopRight: =0
                              Width: =If(App.Width < BreakpointPhone, Parent.Width, (Parent.Width - SpaceMd) / 2 - 1)
                            Children:
                              - lblPaneFieldEmailCaption:
                                  Control: ModernText
                                  Properties:
                                    AccessibleLabel: =Self.Text
                                    AlignInContainer: =AlignInContainer.Stretch
                                    AutoHeight: =true
                                    Color: =ColorTextSecondary
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    Size: =FontSizeCaption
                                    Text: ="Email"
                              - lblPaneFieldEmailValue:
                                  Control: ModernText
                                  Properties:
                                    AccessibleLabel: =Self.Text
                                    AlignInContainer: =AlignInContainer.Stretch
                                    AutoHeight: =true
                                    Color: =ColorTextPrimary
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    Size: =If(App.Width < BreakpointPhone, FontSizeBodyPhone, FontSizeBody)
                                    Text: =Coalesce(gblSelectedRequest.RequesterEmail, "—")
                        - cntPaneFieldPhone:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              AlignInContainer: =AlignInContainer.Start
                              DropShadow: =DropShadow.None
                              FillPortions: =0
                              Height: =FieldHeight
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =SpaceXs
                              LayoutMinHeight: =FieldHeight
                              LayoutMinWidth: =160
                              RadiusBottomLeft: =0
                              RadiusBottomRight: =0
                              RadiusTopLeft: =0
                              RadiusTopRight: =0
                              Width: =If(App.Width < BreakpointPhone, Parent.Width, (Parent.Width - SpaceMd) / 2 - 1)
                            Children:
                              - lblPaneFieldPhoneCaption:
                                  Control: ModernText
                                  Properties:
                                    AccessibleLabel: =Self.Text
                                    AlignInContainer: =AlignInContainer.Stretch
                                    AutoHeight: =true
                                    Color: =ColorTextSecondary
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    Size: =FontSizeCaption
                                    Text: ="Phone"
                              - lblPaneFieldPhoneValue:
                                  Control: ModernText
                                  Properties:
                                    AccessibleLabel: =Self.Text
                                    AlignInContainer: =AlignInContainer.Stretch
                                    AutoHeight: =true
                                    Color: =ColorTextPrimary
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    Size: =If(App.Width < BreakpointPhone, FontSizeBodyPhone, FontSizeBody)
                                    Text: =Coalesce(gblSelectedRequest.RequesterPhone, "—")
                        - cntPaneFieldReceived:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              AlignInContainer: =AlignInContainer.Start
                              DropShadow: =DropShadow.None
                              FillPortions: =0
                              Height: =FieldHeight
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =SpaceXs
                              LayoutMinHeight: =FieldHeight
                              LayoutMinWidth: =160
                              RadiusBottomLeft: =0
                              RadiusBottomRight: =0
                              RadiusTopLeft: =0
                              RadiusTopRight: =0
                              Width: =If(App.Width < BreakpointPhone, Parent.Width, (Parent.Width - SpaceMd) / 2 - 1)
                            Children:
                              - lblPaneFieldReceivedCaption:
                                  Control: ModernText
                                  Properties:
                                    AccessibleLabel: =Self.Text
                                    AlignInContainer: =AlignInContainer.Stretch
                                    AutoHeight: =true
                                    Color: =ColorTextSecondary
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    Size: =FontSizeCaption
                                    Text: ="Received"
                              - lblPaneFieldReceivedValue:
                                  Control: ModernText
                                  Properties:
                                    AccessibleLabel: =Self.Text
                                    AlignInContainer: =AlignInContainer.Stretch
                                    AutoHeight: =true
                                    Color: =ColorTextPrimary
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    Size: =If(App.Width < BreakpointPhone, FontSizeBodyPhone, FontSizeBody)
                                    Text: =If(IsBlank(gblSelectedRequest.ReceivedDate), "—", Text(gblSelectedRequest.ReceivedDate, "mmm d, yyyy"))
                        - cntPaneFieldDueDate:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              AlignInContainer: =AlignInContainer.Start
                              DropShadow: =DropShadow.None
                              FillPortions: =0
                              Height: =FieldHeight
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =SpaceXs
                              LayoutMinHeight: =FieldHeight
                              LayoutMinWidth: =160
                              RadiusBottomLeft: =0
                              RadiusBottomRight: =0
                              RadiusTopLeft: =0
                              RadiusTopRight: =0
                              Width: =If(App.Width < BreakpointPhone, Parent.Width, (Parent.Width - SpaceMd) / 2 - 1)
                            Children:
                              - lblPaneFieldDueDateCaption:
                                  Control: ModernText
                                  Properties:
                                    AccessibleLabel: =Self.Text
                                    AlignInContainer: =AlignInContainer.Stretch
                                    AutoHeight: =true
                                    Color: =ColorTextSecondary
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    Size: =FontSizeCaption
                                    Text: ="Working due date"
                              - lblPaneFieldDueDateValue:
                                  Control: ModernText
                                  Properties:
                                    AccessibleLabel: =Self.Text
                                    AlignInContainer: =AlignInContainer.Stretch
                                    AutoHeight: =true
                                    Color: =If(gblSelectedRequest.DueDateConfirmed, ColorTextPrimary, ColorWarning)
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    Size: =If(App.Width < BreakpointPhone, FontSizeBodyPhone, FontSizeBody)
                                    Text: =If(IsBlank(gblSelectedRequest.DueDate), "Not set", Text(gblSelectedRequest.DueDate, "mmm d, yyyy") & If(gblSelectedRequest.DueDateConfirmed, " · Confirmed", " · Unconfirmed"))
                        - cntPaneFieldRoute:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              AlignInContainer: =AlignInContainer.Start
                              DropShadow: =DropShadow.None
                              FillPortions: =0
                              Height: =FieldHeight
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =SpaceXs
                              LayoutMinHeight: =FieldHeight
                              LayoutMinWidth: =160
                              RadiusBottomLeft: =0
                              RadiusBottomRight: =0
                              RadiusTopLeft: =0
                              RadiusTopRight: =0
                              Width: =If(App.Width < BreakpointPhone, Parent.Width, (Parent.Width - SpaceMd) / 2 - 1)
                            Children:
                              - lblPaneFieldRouteCaption:
                                  Control: ModernText
                                  Properties:
                                    AccessibleLabel: =Self.Text
                                    AlignInContainer: =AlignInContainer.Stretch
                                    AutoHeight: =true
                                    Color: =ColorTextSecondary
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    Size: =FontSizeCaption
                                    Text: ="Route"
                              - lblPaneFieldRouteValue:
                                  Control: ModernText
                                  Properties:
                                    AccessibleLabel: =Self.Text
                                    AlignInContainer: =AlignInContainer.Stretch
                                    AutoHeight: =true
                                    Color: =ColorTextPrimary
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    Size: =If(App.Width < BreakpointPhone, FontSizeBodyPhone, FontSizeBody)
                                    Text: =Coalesce(gblSelectedRequest.RequestRoute.Value, "—")
                        - cntPaneFieldIntakeMethod:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              AlignInContainer: =AlignInContainer.Start
                              DropShadow: =DropShadow.None
                              FillPortions: =0
                              Height: =FieldHeight
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =SpaceXs
                              LayoutMinHeight: =FieldHeight
                              LayoutMinWidth: =160
                              RadiusBottomLeft: =0
                              RadiusBottomRight: =0
                              RadiusTopLeft: =0
                              RadiusTopRight: =0
                              Width: =If(App.Width < BreakpointPhone, Parent.Width, (Parent.Width - SpaceMd) / 2 - 1)
                            Children:
                              - lblPaneFieldIntakeMethodCaption:
                                  Control: ModernText
                                  Properties:
                                    AccessibleLabel: =Self.Text
                                    AlignInContainer: =AlignInContainer.Stretch
                                    AutoHeight: =true
                                    Color: =ColorTextSecondary
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    Size: =FontSizeCaption
                                    Text: ="Intake method"
                              - lblPaneFieldIntakeMethodValue:
                                  Control: ModernText
                                  Properties:
                                    AccessibleLabel: =Self.Text
                                    AlignInContainer: =AlignInContainer.Stretch
                                    AutoHeight: =true
                                    Color: =ColorTextPrimary
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    Size: =If(App.Width < BreakpointPhone, FontSizeBodyPhone, FontSizeBody)
                                    Text: =Coalesce(gblSelectedRequest.IntakeMethod.Value, "—")
                        - cntPaneFieldDepartment:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              AlignInContainer: =AlignInContainer.Start
                              DropShadow: =DropShadow.None
                              FillPortions: =0
                              Height: =FieldHeight
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =SpaceXs
                              LayoutMinHeight: =FieldHeight
                              LayoutMinWidth: =160
                              RadiusBottomLeft: =0
                              RadiusBottomRight: =0
                              RadiusTopLeft: =0
                              RadiusTopRight: =0
                              Width: =If(App.Width < BreakpointPhone, Parent.Width, (Parent.Width - SpaceMd) / 2 - 1)
                            Children:
                              - lblPaneFieldDepartmentCaption:
                                  Control: ModernText
                                  Properties:
                                    AccessibleLabel: =Self.Text
                                    AlignInContainer: =AlignInContainer.Stretch
                                    AutoHeight: =true
                                    Color: =ColorTextSecondary
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    Size: =FontSizeCaption
                                    Text: ="Primary department"
                              - lblPaneFieldDepartmentValue:
                                  Control: ModernText
                                  Properties:
                                    AccessibleLabel: =Self.Text
                                    AlignInContainer: =AlignInContainer.Stretch
                                    AutoHeight: =true
                                    Color: =ColorTextPrimary
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    Size: =If(App.Width < BreakpointPhone, FontSizeBodyPhone, FontSizeBody)
                                    Text: =Coalesce(gblSelectedRequest.PrimaryDepartment.Value, "—")
                        - cntPaneFieldDeliveryFormat:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              AlignInContainer: =AlignInContainer.Start
                              DropShadow: =DropShadow.None
                              FillPortions: =0
                              Height: =FieldHeight
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =SpaceXs
                              LayoutMinHeight: =FieldHeight
                              LayoutMinWidth: =160
                              RadiusBottomLeft: =0
                              RadiusBottomRight: =0
                              RadiusTopLeft: =0
                              RadiusTopRight: =0
                              Width: =If(App.Width < BreakpointPhone, Parent.Width, (Parent.Width - SpaceMd) / 2 - 1)
                            Children:
                              - lblPaneFieldDeliveryFormatCaption:
                                  Control: ModernText
                                  Properties:
                                    AccessibleLabel: =Self.Text
                                    AlignInContainer: =AlignInContainer.Stretch
                                    AutoHeight: =true
                                    Color: =ColorTextSecondary
