                                          Color: =ColorTextSecondary
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingRight: =0
                                          PaddingTop: =0
                                          Size: =FontSizeCaption
                                          Text: =ThisItem.Shown & " · " & ThisItem.Detail
                                          Wrap: =false
                  - lblPaneTimelineEmpty:
                      Control: ModernText
                      Properties:
                        AccessibleLabel: =Self.Text
                        AlignInContainer: =AlignInContainer.Stretch
                        AutoHeight: =true
                        Color: =ColorTextSecondary
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =If(App.Width < BreakpointPhone, FontSizeBodyPhone, FontSizeBody)
                        Text: ="No dated activity yet."
                        Visible: =galPaneTimeline.AllItemsCount = 0
